# Copiar a .github/workflows/terraform.yml
#
# Autenticación por OIDC (federated credential sobre este repo). No hay
# secrets de cliente ni llaves SSH: `azure/login` obtiene un token de corta
# vida.
#
# El PR corre análisis estático + costo + plan. El apply es SIEMPRE manual.
name: terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a desplegar
        required: true
        default: dev
        type: choice
        options: [dev, prod]
  pull_request:
    paths:
      - 'infra/terraform/**'
  schedule:
    # Drift detection: lunes 07:00 UTC.
    - cron: '0 7 * * 1'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # Gate estático: corre en cada PR y es lo que evita repetir defectos como el
  # WAF creado pero no asociado, o un storage con acceso público.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          # Reglas silenciadas a propósito, con motivo:
          #  CKV_AZURE_109 — Key Vault con acceso público: el private endpoint
          #    es opcional por costo (keyvault_private_endpoint_enabled).
          #  CKV_AZURE_206 — Storage LRS: el directorio de tenants usa RAGRS,
          #    el resto no guarda datos.
          skip_check: CKV_AZURE_109,CKV_AZURE_206

      - name: Subir hallazgos al Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  plan-apply:
    runs-on: ubuntu-latest
    needs: scan
    # El environment de GitHub es el que exige aprobación manual para prod.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="key=${{ github.event.inputs.environment || 'dev' }}.tfstate"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file=terraform.tfvars -out=tfplan

      # Delta de costo del PR. Sin esto, un cambio de sku pasa desapercibido
      # hasta la factura.
      - name: Infracost
        if: github.event_name == 'pull_request'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Comentar el delta de costo en el PR
        if: github.event_name == 'pull_request'
        run: |
          terraform show -json tfplan > plan.json
          infracost breakdown --path plan.json --format json --out-file infracost.json
          infracost comment github \
            --path infracost.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --behavior update
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      # Apply sólo en ejecución manual, nunca automático desde un PR.
      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan

  # Detecta cambios hechos a mano en el portal. Corre los lunes a la mañana.
  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="key=${{ matrix.environment }}.tfstate"
      - name: Detectar drift
        run: terraform plan -var-file=terraform.tfvars -detailed-exitcode
