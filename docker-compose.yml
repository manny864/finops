version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: finops_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: finops_app
      MYSQL_USER: finops_user
      MYSQL_PASSWORD: finopspassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
