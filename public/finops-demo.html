<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap');
:root{
  --brand-deep:#0054A6; --brand-bright:#00AEEF; --celeste:#90CAF9; --navy:#1E3A8A;
  --grey:#7F7F7F; --grey-dark:#3C3C3C;
  --nav-bg:#0C1B30; --nav-bg2:#0A1728;
  --bg:#EEF3F9; --surface:#FFFFFF; --surface-2:#F6F9FD;
  --line:#E3EBF3; --line-strong:#CFDDEC; --ink:#1B2A41; --ink-soft:#5A6B82;
  --green:#1FA971; --green-soft:#E6F7EF; --amber:#E08A1E; --amber-soft:#FCF1DF;
  --danger:#E0556B; --danger-soft:#FBE9ED; --purple:#7A4FB5;
  --shadow:0 1px 2px rgba(16,40,73,.06),0 8px 24px rgba(16,40,73,.07);
  --shadow-lg:0 18px 50px rgba(16,40,73,.18); --r:14px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Montserrat',system-ui,sans-serif;margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ===== SHELL ===== */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.nav{background:linear-gradient(180deg,var(--nav-bg),var(--nav-bg2));color:#A9BBD0;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid #0a1726}
.nav::-webkit-scrollbar{width:7px}.nav::-webkit-scrollbar-thumb{background:#1c3149;border-radius:9px}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand .bt .l1{font-family:'Montserrat';font-weight:800;font-size:15px;color:#fff;letter-spacing:.2px;line-height:1}
.brand .bt .l1 b{color:var(--brand-bright)}
.brand .bt .l2{font-size:9.5px;letter-spacing:2px;color:#62809c;text-transform:uppercase;font-weight:600;margin-top:3px}
.nav-grouplabel{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#566f8c;font-weight:700;padding:16px 20px 7px;display:flex;align-items:center;justify-content:space-between}
.nav-grouplabel span{opacity:.6}
.nav-item{display:flex;align-items:center;gap:12px;margin:2px 10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:#A9BBD0;font-size:13.5px;font-weight:600;transition:.13s;position:relative}
.nav-item svg{flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.055);color:#dce8f5}
.nav-item.active{background:linear-gradient(135deg,var(--brand-deep),#1E88E5);color:#fff;box-shadow:0 6px 16px rgba(0,84,166,.4)}
.nav-item.active svg{opacity:1}
.nav-item .ind{position:absolute;right:11px;font-size:10px;font-weight:700;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:99px}
.nav-item.active .ind{background:rgba(255,255,255,.25)}

/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:11px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.scope-sel{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:6px 9px 6px 12px;box-shadow:var(--shadow)}
.scope-sel label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--grey);font-weight:700}
.scope-sel select,.ai-mini select{border:0;background:transparent;font-family:'Montserrat';font-weight:700;font-size:13px;color:var(--brand-deep);cursor:pointer;outline:none}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--green-soft)}50%{box-shadow:0 0 0 7px rgba(31,169,113,.10)}}
.ai-mini{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:5px 8px 5px 11px;box-shadow:var(--shadow)}
.ai-mini label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--grey);font-weight:700}
.btn{font-family:'Montserrat';font-weight:600;font-size:13px;border-radius:10px;border:1px solid transparent;padding:9px 14px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--brand-deep),var(--brand-bright));color:#fff;box-shadow:0 6px 16px rgba(0,84,166,.28)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--brand-bright);color:var(--brand-deep)}
.btn-sm{padding:7px 11px;font-size:12px}
.btn:active{transform:scale(.98)} .btn:disabled{opacity:.45;cursor:not-allowed}
.icobtn{position:relative}
.icobtn .badge-n{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 3px}

/* ===== CONTENT ===== */
.content{padding:24px;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.vhead .vt{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.4px;display:flex;align-items:center;gap:11px}
.vhead .vt .vico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-deep),var(--brand-bright));color:#fff}
.vhead .vs{font-size:13px;color:var(--ink-soft);margin-top:3px}
.vhead .right{margin-left:auto;display:flex;gap:9px;align-items:center}
.scopechip{font-size:11px;font-weight:700;letter-spacing:.4px;background:#E6F2FB;color:var(--brand-deep);padding:5px 11px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px}
.card-h .sub{font-size:11.5px;color:var(--grey)}
.tag{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.blue{background:#E6F2FB;color:var(--brand-deep)} .tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)} .tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.grey{background:#EEF1F5;color:var(--grey)} .tag.purple{background:#F0E9FB;color:var(--purple)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand-bright);opacity:0;transition:.3s}
.kpi:hover::after{opacity:1}
.kpi .lab{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--grey);font-weight:700}
.kpi .val{font-family:'Montserrat';font-weight:800;font-size:24px;color:var(--ink);margin-top:9px;letter-spacing:-.5px}
.kpi .val.sm{font-size:21px}
.kpi.accent .val{color:var(--green)}
.kpi .delta{font-size:11px;font-weight:600;margin-top:5px} .kpi .delta.down{color:var(--green)} .kpi .delta.up{color:var(--danger)}

.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.chart-wrap{padding:16px 18px}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.legend-row .li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.legend-row .sw{width:11px;height:11px;border-radius:3px}

/* summary strip */
.sumstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sumstrip .s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.sumstrip .s .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--grey);font-weight:700}
.sumstrip .s .v{font-family:'Montserrat';font-weight:800;font-size:22px;margin-top:6px;color:var(--ink)}
.sumstrip .s.green .v{color:var(--green)} .sumstrip .s.blue .v{color:var(--brand-deep)} .sumstrip .s.amber .v{color:var(--amber)}

/* rec rows */
.rec{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);transition:.18s}
.rec:last-child{border-bottom:0} .rec:hover{background:var(--surface-2)}
.rec .ricon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.ri-blue{background:#E6F2FB;color:var(--brand-deep)} .ri-amber{background:var(--amber-soft);color:var(--amber)}
.ri-green{background:var(--green-soft);color:var(--green)} .ri-red{background:var(--danger-soft);color:var(--danger)}
.rec .rtitle{font-weight:700;font-size:13.5px;color:var(--ink)}
.rec .rtitle .res{font-weight:600;color:var(--brand-deep);background:#EAF3FB;padding:1px 7px;border-radius:6px;font-size:12px;margin-left:6px}
.rec .rdesc{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5} .rec .rdesc b{color:var(--ink)}
.rec .rright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.rec .save{font-family:'Montserrat';font-weight:800;font-size:15px;color:var(--green)} .rec .save .pm{font-size:10.5px;color:var(--grey);font-weight:600}
.rec.applied{background:var(--green-soft)} .rec.applied:hover{background:#DCF3E8}
.empty{padding:34px;text-align:center;color:var(--grey);font-size:13px}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.tbl tr:last-child td{border-bottom:0} .tbl tr:hover td{background:var(--surface-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nmain{font-weight:700} .tbl .nsub{font-size:11px;color:var(--grey)}
.statusdot{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12px}
.statusdot i{width:8px;height:8px;border-radius:50%}

/* bars */
.bars{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.bar-line{display:grid;grid-template-columns:150px 1fr 80px;align-items:center;gap:12px}
.bar-line .bl{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.bar-track{height:11px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.bar-line .bv{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--ink);text-align:right}

/* gov / gauges */
.gov{padding:18px;display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}
.gov-list{display:flex;flex-direction:column;gap:11px}
.gov-item{display:flex;align-items:center;gap:11px;font-size:12.5px;color:var(--ink-soft)} .gov-item b{color:var(--ink)}
.gov-item .gi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0;font-size:13px}

/* maturity */
.mat-domains{display:flex;flex-direction:column;gap:14px;padding:4px}
.mat-d{display:grid;grid-template-columns:160px 1fr 80px;align-items:center;gap:14px}
.mat-d .mn{font-weight:700;font-size:13px;color:var(--ink)}
.mat-steps{display:flex;gap:6px}
.mat-step{flex:1;height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.mat-step.on{background:linear-gradient(90deg,var(--brand-deep),var(--brand-bright));border-color:transparent}
.mat-lvl{font-size:11.5px;font-weight:700;text-align:right}
.lvl1{color:var(--amber)} .lvl2{color:var(--brand-bright)} .lvl3{color:var(--green)}

/* heatmap */
.heat{display:grid;grid-template-columns:46px repeat(12,1fr);gap:3px;padding:16px 18px}
.heat .hc{height:20px;border-radius:4px;background:var(--green-soft)} .heat .hc.off{background:#D7E3F0} .heat .hc.on{background:linear-gradient(135deg,var(--brand-deep),var(--brand-bright))}
.heat .hlab{font-size:10.5px;color:var(--grey);display:flex;align-items:center;font-weight:600}
.heat .htime{font-size:9px;color:var(--grey);text-align:center}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(16,30,52,.42);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:390px;max-width:92vw;background:var(--surface);z-index:70;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:15px} .drawer .db{overflow:auto;flex:1}
.xbtn{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;color:var(--ink-soft)}
.alog{display:flex;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:flex-start;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.alog .at{font-variant-numeric:tabular-nums;font-size:11px;color:var(--grey);white-space:nowrap;padding-top:1px}
.alog .ab{font-size:12.5px;color:var(--ink);line-height:1.45} .alog .ab b{color:var(--brand-deep)}
.alog .badge{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:6px}
.badge.b-apply{background:var(--green-soft);color:var(--green)} .badge.b-audit{background:#E6F2FB;color:var(--brand-deep)} .badge.b-ai{background:#F0E9FB;color:var(--purple)}

.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);width:620px;max-width:94vw;max-height:86vh;background:var(--surface);border-radius:18px;z-index:71;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;display:flex;flex-direction:column;overflow:hidden}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:16px;display:flex;align-items:center;gap:9px}
.modal .mb{padding:20px 22px;overflow:auto}
.ai-out{font-size:13px;line-height:1.65;color:var(--ink);white-space:pre-wrap;min-height:200px}
.ai-out .mdh{font-family:'Montserrat';font-weight:700;color:var(--brand-deep);display:block;margin:11px 0 3px;font-size:14px}
.caret{display:inline-block;width:8px;height:15px;background:var(--brand-bright);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ai-placeholder{color:var(--grey);font-style:italic;text-align:center;padding:40px 10px}

/* toasts */
.toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand-bright);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-lg);animation:toastIn .3s ease}
.toast.teams{border-left-color:#5B5FC7} .toast.slack{border-left-color:#36C5AB}
.toast .tic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.tic.teams{background:#5B5FC7}.tic.slack{background:#36C5AB}
.toast .tt{font-family:'Montserrat';font-weight:700;font-size:12.5px;color:var(--ink)}
.toast .td{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.fade-out{animation:toastOut .4s forwards}@keyframes toastOut{to{opacity:0;transform:translateX(30px);height:0;margin:0;padding:0}}

@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.grid-2,.grid-5{grid-template-columns:1fr}.grid-5{grid-template-columns:repeat(2,1fr)}.shell{grid-template-columns:64px 1fr}.brand .bt,.nav-grouplabel,.nav-item span.lbl,.nav-item .ind{display:none}.nav-item{justify-content:center}}
@media(max-width:640px){.kpis,.grid-3,.sumstrip{grid-template-columns:repeat(2,1fr)}.content{padding:16px}}
</style>

function metrics(){
  const subs=subsInScope(),recs=recsInScope();
  const base=subs.reduce((a,s)=>a+s.spend,0);
  const applied=recs.filter(r=>STATE.applied.has(r.id)).reduce((a,r)=>a+r.save,0);

  const zombies=recs.filter(r=>r.type==='cleanup'&&!STATE.applied.has(r.id)).reduce((a,r)=>a+(r.count||0),0);

}

/* ============ CHARTS ============ */
function svgTrend(m){
  const W=620,H=210,pad={l:44,r:14,t:14,b:26};
  const hist=[m.base*1.08,m.base*1.04,m.base*1.07,m.base*1.02,m.base*1.03,m.current];
  const labels=['Ene','Feb','Mar','Abr','May','Jun'];
  const maxV=Math.max(...hist,m.base*1.1),minV=Math.min(m.potential*.96,...hist);
  const x=i=>pad.l+(W-pad.l-pad.r)*(i/(hist.length-1)),y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-minV)/(maxV-minV));
  const line=hist.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=line+` L${x(hist.length-1)} ${H-pad.b} L${x(0)} ${H-pad.b} Z`;
  let grid='';for(let i=0;i<=3;i++){const gv=minV+(maxV-minV)*i/3,gy=y(gv);grid+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="#E3EBF3"/><text x="${pad.l-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="#9E9E9E">${moneyK(gv)}</text>`;}
  const xl=labels.map((l,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="10" fill="#9E9E9E">${l}</text>`).join('');
  const yT=y(m.potential),lx=x(hist.length-1),ly=y(m.current);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" font-family="Open Sans"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00AEEF" stop-opacity=".28"/><stop offset="1" stop-color="#00AEEF" stop-opacity="0"/></linearGradient></defs>
   ${grid}${xl}<line x1="${pad.l}" y1="${yT}" x2="${W-pad.r}" y2="${yT}" stroke="#7F7F7F" stroke-width="1.4" stroke-dasharray="5 4"/>
   <text x="${W-pad.r}" y="${yT-6}" text-anchor="end" font-size="10" fill="#7F7F7F" font-weight="600" font-family="Montserrat">Potencial ${moneyK(m.potential)}</text>
   <path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#00AEEF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="${lx}" cy="${ly}" r="6" fill="#fff" stroke="${m.applied>0?'#1FA971':'#00AEEF'}" stroke-width="3"/>
   <text x="${lx-4}" y="${ly-13}" text-anchor="end" font-size="11" font-weight="800" fill="${m.applied>0?'#1FA971':'#0054A6'}" font-family="Montserrat">${moneyK(m.current)}</text></svg>`;
}
function svgDonut(data,total,unit){
  const cols=data.map(d=>d.c||'#0054A6');const R=58,C=2*Math.PI*R;let off=0;
  const rings=data.map((d,i)=>{const len=C*(d.val/total);const s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${cols[i]}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)" style="transition:.7s"/>`;off+=len;return s;}).join('');
  const leg=data.map((d,i)=>`<div class="li"><span class="sw" style="background:${cols[i]}"></span>${d.name} · ${money(d.val)}</div>`).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center"><svg viewBox="0 0 160 160" width="150" height="150" font-family="Montserrat">${rings}<text x="80" y="74" text-anchor="middle" font-size="20" font-weight="800" fill="#1B2A41">${moneyK(total)}</text><text x="80" y="93" text-anchor="middle" font-size="10" fill="#9E9E9E" font-family="Open Sans">${unit||'gasto / mes'}</text></svg><div class="legend-row" style="flex-direction:column;gap:9px;margin:0">${leg}</div></div>`;
}

 madurez(){const avg=DOMAINS.reduce((a,d)=>a+d.lvl,0)/DOMAINS.length;const overall=avg<1.7?'Gatear':avg<2.4?'Caminar':'Correr';

 progreso(){const m=metrics();const W=620,H=220,pad={l:46,r:14,t:16,b:26};

  let grid='';for(let i=0;i<=3;i++){const gv=minV+(maxV-minV)*i/3,gy=y(gv);grid+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="#E3EBF3"/><text x="${pad.l-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="#9E9E9E">${moneyK(gv)}</text>`;}
  const xl=months.map((mn,i)=>i%2===0?`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="#9E9E9E">${mn}</text>`:'').join('');

    <svg viewBox="0 0 ${W} ${H}" width="100%" font-family="Open Sans"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FA971" stop-opacity=".26"/><stop offset="1" stop-color="#1FA971" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#1FA971" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(11)}" cy="${y(series[11])}" r="6" fill="#fff" stroke="#1FA971" stroke-width="3"/></svg></div></div>
   <div class="card"><div class="card-h"><h3>🏁 Hitos</h3></div>

    <div class="rec"><div class="ricon ri-amber">🌙</div><div><div class="rtitle">Apagado automático en no-productivos</div><div class="rdesc">Power schedules activos en QA y DEV.</div></div></div></div>`;
 },
};

/* ============ ACTIONS ============ */
function applyRec(id){const r=RECS.find(x=>x.id===id);if(!r||STATE.applied.has(id))return;STATE.applied.add(id);
  log('apply',`<b>${r.title}</b> aplicado en ${subName(r.sub)} — ahorro <b>${money(r.save)}/mes</b>.`);
  notify(Math.random()>.5?'teams':'slack','Optimización aplicada',`${r.title} · ${r.res} · −${money(r.save)}/mes`);rerender();}
function undoRec(id){const r=RECS.find(x=>x.id===id);if(!r)return;STATE.applied.delete(id);log('audit',`<b>${r.title}</b> revertido en ${subName(r.sub)}.`);rerender();}
function injectTags(){if(STATE.tagsInjected)return;STATE.tagsInjected=true;STATE.compliance=96;log('apply','Etiquetas obligatorias inyectadas — compliance <b>68% → 96%</b>.');notify('slack','Gobernanza actualizada','Compliance de etiquetado al 96% en '+scopeName()+'.');rerender();}
function auditTags(){log('audit','Auditoría de etiquetas ejecutada sobre <b>'+scopeName()+'</b>.');notify('teams','Auditoría de etiquetas','Reporte de cumplimiento publicado en #finops.');}
function ttlExtend(n){STATE.extended[n]=(STATE.extended[n]||0)+7;log('audit',`TTL de <b>${n}</b> extendido +7 días.`);rerender();}
function ttlDel(n){const t=TTLS.find(x=>x.name===n);STATE.deleted.add(n);log('apply',`Entorno temporal <b>${n}</b> eliminado — ahorro <b>${money(t.cost)}/mes</b>.`);notify('teams','Entorno TTL eliminado',`${n} · −${money(t.cost)}/mes`);rerender();}

/* ============ AUDIT / TOASTS ============ */
const nowStr=()=>new Date().toTimeString().slice(0,8);
function log(kind,html){STATE.audit.unshift({t:nowStr(),kind,html});renderAudit();const n=$('#actN');n.textContent=STATE.audit.length;n.style.display='grid';}
function renderAudit(){const b=$('#auditBody');if(!STATE.audit.length){b.innerHTML='<div class="empty">Sin acciones registradas todavía.</div>';return;}
  const bd={apply:'b-apply',audit:'b-audit',ai:'b-ai'},bl={apply:'aplicar',audit:'auditar',ai:'IA'};
  b.innerHTML=STATE.audit.map(a=>`<div class="alog"><span class="at">${a.t}</span><span class="ab">${a.html}<span class="badge ${bd[a.kind]}">${bl[a.kind]}</span></span></div>`).join('');}
function notify(ch,title,desc){const c=$('#toasts');const el=document.createElement('div');el.className='toast '+ch;
  el.innerHTML=`<div class="tic ${ch}">${ch==='teams'?'T':'S'}</div><div><div class="tt">${title}</div><div class="td">${desc}<br><span style="color:var(--grey)">→ ${ch==='teams'?'Microsoft Teams':'Slack'} · webhook</span></div></div>`;
  c.appendChild(el);setTimeout(()=>{el.classList.add('fade-out');setTimeout(()=>el.remove(),420);},4200);}

/* ============ AI REPORT ============ */
function buildReport(){const m=metrics();const capt=m.identified?Math.round(m.applied/m.identified*100):0;
  const top=[...recsInScope()].sort((a,b)=>b.save-a.save).slice(0,3);
  return [['# Resumen ejecutivo — '+scopeName(),`Alcance: ${subsInScope().length} suscripción(es). Gasto mensual actual ${money(m.current)}; proyección anual ${money(m.annual)}.`],
   ['## Oportunidad de optimización',`Se identificaron ${money(m.identified)}/mes en ahorros (${Math.round(m.identified/m.base*100)}% del gasto base). Capturado: ${capt}% (${money(m.applied)}/mes).`],
   ['## Acciones de mayor impacto',top.map((r,i)=>`${i+1}. ${r.title} en ${subName(r.sub)}: ${money(r.save)}/mes${STATE.applied.has(r.id)?' (aplicado)':''}.`).join('\n')],
   ['## Gobernanza',`Compliance de etiquetado en ${STATE.compliance}%. ${STATE.compliance<80?'Conviene inyectar etiquetas faltantes para un showback fiable.':'Nivel adecuado para chargeback por área.'}`],
   ['## Recomendación',m.pending>0?`Priorizar las recomendaciones pendientes para alcanzar el potencial de ${money(m.potential)}/mes.`:'Todo el alcance fue optimizado. Mantener monitoreo continuo.'],
   ['',`— Generado por ${STATE.ai} · AI Report Engine (agnóstico)`]];}
function genReport(){const out=$('#aiOut'),btn=$('#genReport');btn.disabled=true;btn.textContent='⏳ '+STATE.ai+' redactando…';
  const blocks=buildReport();out.innerHTML='';let bi=0;
  (function nextBlock(){if(bi>=blocks.length){btn.disabled=false;btn.textContent='✨ Regenerar';log('ai','Resumen ejecutivo generado por <b>'+STATE.ai+'</b> sobre '+scopeName()+'.');notify('teams','Reporte FinOps listo','Resumen generado por '+STATE.ai+'.');return;}
    const[head,body]=blocks[bi++];if(head){const h=document.createElement('span');h.className='mdh';h.textContent=head.replace(/^#+\s*/,'');out.appendChild(h);}
    const span=document.createElement('span');out.appendChild(span);const caret=document.createElement('span');caret.className='caret';out.appendChild(caret);
    let ci=0;(function type(){if(ci<body.length){span.textContent+=body[ci++];out.parentElement.scrollTop=out.parentElement.scrollHeight;setTimeout(type,body[ci-1]==='\n'?2:7);}else{span.textContent+='\n';caret.remove();setTimeout(nextBlock,80);}})();})();}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');if(nav){STATE.view=nav.dataset.nav;rerender();window.scrollTo({top:0,behavior:'smooth'});return;}
  const ap=e.target.closest('[data-apply]');if(ap){applyRec(ap.dataset.apply);return;}
  const un=e.target.closest('[data-undo]');if(un){undoRec(un.dataset.undo);return;}
  const ex=e.target.closest('[data-extend]');if(ex){ttlExtend(ex.dataset.extend);return;}
  const dl=e.target.closest('[data-del]');if(dl){ttlDel(dl.dataset.del);return;}
  if(e.target.closest('[data-inject]')){injectTags();return;}
  if(e.target.closest('[data-audit-tags]')){auditTags();return;}
});
document.addEventListener('change',e=>{
  if(e.target.id==='scopeSel'){STATE.selected=e.target.value;rerender();}
  if(e.target.id==='aiProvider'){STATE.ai=e.target.value;}
  if(e.target.id==='sbMethod'){STATE.sbMethod=e.target.value;rerender();}
});
