name: FinOps PR Cost Estimator
description: >-
  Calcula el impacto en el costo mensual de Azure de un cambio de infraestructura
  (Terraform, OpenTofu o Bicep) y lo comenta en el Pull Request. Opcionalmente falla
  el check si el aumento supera un umbral (Budget Gate).
author: CSCloudSolutions

branding:
  icon: dollar-sign
  color: blue

inputs:
  api-key:
    description: 'API Key de la plataforma FinOps con el scope `write:shift-left`. Pasala por secrets, nunca literal.'
    required: true
  tool:
    description: '`terraform` (por defecto), `tofu` o `bicep`.'
    required: false
    default: terraform
  plan-file:
    description: 'Plan binario de `terraform|tofu plan -out=...`. Ignorado si se pasa `plan-json`.'
    required: false
    default: tfplan.bin
  plan-json:
    description: >-
      Plan ya en JSON (`terraform show -json`), o la salida de
      `az deployment group what-if --no-pretty-print` si `tool` es `bicep`.
    required: false
    default: ''
  threshold-usd:
    description: >-
      Umbral de este workflow, en USD por mes. Si la plataforma también tiene uno para el
      repositorio, falla el MÁS ESTRICTO de los dos: un workflow puede apretar el gate, no aflojarlo.
    required: false
    default: ''
  comment:
    description: 'Comentar el resultado en el PR (se edita en cada push). Necesita `permissions: pull-requests: write`.'
    required: false
    default: 'true'
  api-url:
    description: 'Base de la plataforma. Sólo se cambia para apuntar a un entorno propio.'
    required: false
    default: https://finops.cscloudsolutions.com.ar
  script-sha256:
    description: >-
      SHA-256 esperado del script de estimación (lo muestra Gobernanza → Shift-Left). Recomendado:
      si el archivo que se descarga no coincide, el paso falla antes de ejecutarlo.
    required: false
    default: ''

outputs:
  delta-usd:
    description: 'Delta de costo mensual en USD. Negativo si el PR ahorra.'
    value: ${{ steps.estimar.outputs.delta }}
  projected-usd:
    description: 'Costo mensual proyectado en USD.'
    value: ${{ steps.estimar.outputs.projected }}
  unpriced:
    description: 'Cantidad de recursos que no se pudieron tarifar o se cobran por consumo.'
    value: ${{ steps.estimar.outputs.unpriced }}
  gate-status:
    description: 'Budget Gate: OK, EXCEEDED o NOT_EVALUATED.'
    value: ${{ steps.estimar.outputs.gate }}

# Composite y no una action de JavaScript a propósito: una action JS obliga a bundlear con
# ncc y a commitear `dist/`, que se desactualiza en silencio. Acá no hay build, y toda la
# lógica vive en UN script (el mismo que usan Azure DevOps y GitLab) que se descarga de la
# plataforma, se verifica por hash y está probado de punta a punta.
runs:
  using: composite
  steps:
    - id: estimar
      shell: bash
      env:
        # Por env y no interpolado en el `run`: un ${{ }} con el secreto queda escrito en el
        # script que el runner arma en disco, y un input con comillas rompería el shell.
        FINOPS_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        FINOPS_REPOSITORY: ${{ github.repository }}
        FINOPS_PR_NUMBER: ${{ github.event.pull_request.number }}
        FINOPS_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        FINOPS_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        FINOPS_API_URL: ${{ inputs.api-url }}
        FINOPS_TOOL: ${{ inputs.tool }}
        FINOPS_PLAN_FILE: ${{ inputs.plan-file }}
        FINOPS_PLAN_JSON: ${{ inputs.plan-json }}
        FINOPS_THRESHOLD_USD: ${{ inputs.threshold-usd }}
        FINOPS_COMMENT: ${{ inputs.comment }}
        SCRIPT_SHA256: ${{ inputs.script-sha256 }}
      run: |
        set -euo pipefail
        script="$RUNNER_TEMP/finops-estimate.sh"
        curl -fsSL "${FINOPS_API_URL%/}/integrations/shift-left/finops-estimate.sh" -o "$script"
        if [ -n "$SCRIPT_SHA256" ]; then
          echo "$SCRIPT_SHA256  $script" | sha256sum -c -
        fi
        bash "$script"
