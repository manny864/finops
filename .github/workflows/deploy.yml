# Deploy por SSH al VPS. REEMPLAZADO por deploy-azure.yml (Container Apps).
#
# Se conserva, pero SÓLO con disparo manual: el VPS quedó congelado el
# 2026-07-28 y la producción vive en Azure. Con el trigger de `push` puesto,
# un merge a main disparaba ESTE workflow y el de Azure a la vez — desplegando
# al VPS congelado y corriendo sus migraciones por SSH contra la base vieja.
#
# Queda disponible por si hiciera falta volver al VPS en una emergencia
# mientras la migración se estabiliza. Cuando eso deje de ser una opción real,
# borrar este archivo junto con los secrets SERVER_HOST, SERVER_USER y
# SSH_PRIVATE_KEY, que ya no usa ningún workflow automático.
name: Deploy FinOps (VPS — legacy, manual)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS (attempt 1)
        id: deploy1
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 5m
          command_timeout: 20m
          script: |
            set -e
            cd ~/cscloud/finops
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            # Fase 4: build-antes-de-stop + smoke test + rollback automático,
            # ver scripts/deploy-vps.sh y docs/vps-infra-improvement-plan.md
            bash scripts/deploy-vps.sh

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to VPS (attempt 2)
        if: steps.deploy1.outcome == 'failure'
        id: deploy2
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 5m
          command_timeout: 20m
          script: |
            set -e
            cd ~/cscloud/finops
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy-vps.sh

      - name: Wait before final retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        # >600s (bantime de fail2ban en el VPS) — dos intentos fallidos seguidos
        # de SSH pueden haber baneado la IP del runner; 90s no alcanzaba a que
        # el ban expire, así que el 3er intento repetía el mismo timeout SSH.
        # Ver docs/vps-infra-improvement-plan.md (hallazgo Fase 0, mitigación Fase 4).
        run: sleep 660

      - name: Deploy to VPS (attempt 3 - final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 5m
          command_timeout: 20m
          script: |
            set -e
            cd ~/cscloud/finops
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy-vps.sh
