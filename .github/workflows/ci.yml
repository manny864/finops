name: CI

# En `pull_request` corre todo. En `push` a main corre SOLO el job de tests:
# lint, typecheck y build ya los hace el `next build` de la imagen en
# deploy-azure.yml, pero vitest no lo corre nadie — un push a main entraba a
# produccion sin que se ejecutara un solo test. Los otros tres jobs quedan
# condicionados para no pagar minutos por lo que el deploy ya verifica.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'

# Explícito aunque el default del repo ya sea de sólo lectura: que el permiso no
# dependa de un ajuste que se cambia desde Settings sin pasar por un PR. Ningún
# job de acá escribe en el repo ni pide token OIDC.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run lint -- --quiet

  typecheck:
    name: Type Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run typecheck -- --pretty false

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin --protocol=tcp -h127.0.0.1 ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - name: Start isolated Blob emulator with a synthetic account
        id: blob
        run: |
          container="finops-blob-matrix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key="$(node -e 'process.stdout.write(Buffer.alloc(32, 7).toString("base64"))')"
          docker run --detach --name "$container" --tmpfs /data -p 127.0.0.1::10000 \
            -e "AZURITE_ACCOUNTS=finopsmatrix:$key" \
            mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37 \
            azurite-blob --blobHost 0.0.0.0 --location /data --silent --skipApiVersionCheck >/dev/null
          echo "container=$container" >> "$GITHUB_OUTPUT"
          port="$(docker port "$container" 10000/tcp | cut -d: -f2)"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          for _attempt in $(seq 1 30); do
            if curl --silent --max-time 1 --output /dev/null "http://127.0.0.1:$port/"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Real MySQL, Redis and Blob security persistence and tenant isolation
        run: npx vitest run __tests__/integration/securityPersistence.mysql.test.ts __tests__/integration/tenantAuditIsolation.mysql.test.ts __tests__/integration/tenantCacheIsolation.redis.test.ts
        env:
          MYSQL_SECURITY_PORT: ${{ job.services.mysql.ports['3306'] }}
          REDIS_SECURITY_PORT: ${{ job.services.redis.ports['6379'] }}
          AZURITE_SECURITY_PORT: ${{ steps.blob.outputs.port }}
      - name: Remove isolated Blob emulator
        if: always() && steps.blob.outputs.container != ''
        run: docker rm --force "${{ steps.blob.outputs.container }}"
      # AISEC-03: pdfChromiumIsolation prueba con un Chromium real que el PDF no
      # ejecuta JS ni sale a la red. Sin el binario se saltearía en silencio.
      - name: Instalar Chromium headless de Playwright
        run: npx playwright install --with-deps --only-shell chromium
      # En push a main sólo interesa que pasen; la instrumentación de
      # cobertura cuesta tiempo y el reporte no lo mira nadie fuera del PR.
      # `--reporter=json --outputFile` deja el resultado en un archivo ademas
      # de la consola. Sin esto, un fallo intermitente se pierde: el 2026-09-07
      # la suite fallo una vez, no volvio a fallar en 15 corridas y NO se pudo
      # identificar que test era porque el output ya se habia ido del scroll.
      # El artefacto de abajo lo conserva para la proxima.
      - name: Run tests
        if: github.event_name == 'push'
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json
        env:
          CI: true
      - name: Upload test report
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report
          path: vitest-report.json
          retention-days: 14
      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        run: npm run test:coverage
        env:
          CI: true
      - name: Upload coverage artifact
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      # Cache de build de Next.js (https://nextjs.org/docs/messages/no-cache):
      # `cache: 'npm'` de setup-node sólo cachea node_modules, no .next/cache
      # (el cache incremental del compilador). Sin esto cada build recompila
      # todo desde cero. La key incluye el hash del lockfile (nueva
      # dependencia invalida el cache) y de todo src/ + config (cambios de
      # código SÍ pueden reusar el cache — Next.js invalida internamente sólo
      # lo que cambió); restore-keys cae a la key sin el hash de fuentes si no
      # hay match exacto, para no arrancar de cero en cada PR.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKIP_DB_INIT: '1'
