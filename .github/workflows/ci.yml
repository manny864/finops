name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run lint -- --quiet

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run typecheck -- --pretty false

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      # Cache de build de Next.js (https://nextjs.org/docs/messages/no-cache):
      # `cache: 'npm'` de setup-node sólo cachea node_modules, no .next/cache
      # (el cache incremental del compilador). Sin esto cada build recompila
      # todo desde cero. La key incluye el hash del lockfile (nueva
      # dependencia invalida el cache) y de todo src/ + config (cambios de
      # código SÍ pueden reusar el cache — Next.js invalida internamente sólo
      # lo que cambió); restore-keys cae a la key sin el hash de fuentes si no
      # hay match exacto, para no arrancar de cero en cada PR.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKIP_DB_INIT: '1'
