name: CI

# En `pull_request` corre todo. En `push` a main corre SOLO el job de tests:
# lint, typecheck y build ya los hace el `next build` de la imagen en
# deploy-azure.yml, pero vitest no lo corre nadie — un push a main entraba a
# produccion sin que se ejecutara un solo test. Los otros tres jobs quedan
# condicionados para no pagar minutos por lo que el deploy ya verifica.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run lint -- --quiet

  typecheck:
    name: Type Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run typecheck -- --pretty false

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      # En push a main sólo interesa que pasen; la instrumentación de
      # cobertura cuesta tiempo y el reporte no lo mira nadie fuera del PR.
      # `--reporter=json --outputFile` deja el resultado en un archivo ademas
      # de la consola. Sin esto, un fallo intermitente se pierde: el 2026-09-07
      # la suite fallo una vez, no volvio a fallar en 15 corridas y NO se pudo
      # identificar que test era porque el output ya se habia ido del scroll.
      # El artefacto de abajo lo conserva para la proxima.
      - name: Run tests
        if: github.event_name == 'push'
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json
        env:
          CI: true
      - name: Upload test report
        if: failure() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: vitest-report.json
          retention-days: 14
      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        run: npm run test:coverage
        env:
          CI: true
      - name: Upload coverage artifact
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      # Cache de build de Next.js (https://nextjs.org/docs/messages/no-cache):
      # `cache: 'npm'` de setup-node sólo cachea node_modules, no .next/cache
      # (el cache incremental del compilador). Sin esto cada build recompila
      # todo desde cero. La key incluye el hash del lockfile (nueva
      # dependencia invalida el cache) y de todo src/ + config (cambios de
      # código SÍ pueden reusar el cache — Next.js invalida internamente sólo
      # lo que cambió); restore-keys cae a la key sin el hash de fuentes si no
      # hay match exacto, para no arrancar de cero en cada PR.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKIP_DB_INIT: '1'
