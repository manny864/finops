# Build, migraciones, deploy y health de UN ambiente. Lo llaman `deploy-azure.yml` (staging, en cada push a main) y
# `promote-prod.yml` (prod, a mano). Comparte controles, NO el artefacto:
# NEXT_PUBLIC_* difiere por ambiente y obliga a reconstruir. Cada build se identifica por digest.
#
# Esta plantilla no lleva ningún nombre de recurso escrito: los trae el llamador. Así un cambio acá no puede, por error,
# apuntar un deploy de staging a prod ni al revés.
#
# Originalmente era el job `deploy` de deploy-azure.yml (ver su historia para el porqué de cada paso).
name: deploy-reusable
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment: { description: "environment de GitHub (staging | prod)", required: true, type: string }
      sha:         { description: "commit a construir y desplegar",          required: true, type: string }
      acr:         { description: "nombre del ACR (sin .azurecr.io)",        required: true, type: string }
      rg:          { description: "resource group del app y del job",        required: true, type: string }
      app:         { description: "Container App web",                       required: true, type: string }
      migrate_job: { description: "Container App Job de migraciones",        required: true, type: string }

env:
  ACR: ${{ inputs.acr }}
  IMAGE: finops
  RG: ${{ inputs.rg }}
  APP: ${{ inputs.app }}
  MIGRATE_JOB: ${{ inputs.migrate_job }}
  DEPLOY_ENV: ${{ inputs.environment }}
  BUILD_SHA: ${{ inputs.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    steps:
      # `inputs.sha` se interpola en scripts más abajo: se exige un hash de commit antes de usarlo en cualquiera.
      - name: El sha es un hash de commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha inválido: $SHA"; exit 1; }

      # El sha que se construye es el que pide el llamador (el de push en staging, el elegido en la promoción a prod),
      # no el de la ref del workflow: promover un sha viejo no puede construir el HEAD de main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Gate de migracion de claves de aplicacion
        env:
          MIGRATION_READY: ${{ vars.APP_SECRET_MIGRATION_READY }}
        run: |
          [ "$MIGRATION_READY" = "true" ] || {
            echo "Bloqueado: confirmar backup, restauracion y migracion segun docs/security/app-secret-rotation.md"; exit 1;
          }
          az containerapp show -g "$RG" -n "$APP" \
            --query '{env: properties.template.containers[].env, secrets: properties.configuration.secrets}' -o json |
            jq -e '
              [.env[][] | select(.name == "APP_SECRET_ENCRYPTION_KEY" and .secretRef != null) | .secretRef] as $refs |
              ($refs | length) == 1 and any(.secrets[];
                .name == $refs[0] and (.keyVaultUrl // "" | test("^https://[a-zA-Z0-9-]+\\.vault\\.azure\\.net/secrets/[a-zA-Z0-9-]+/[a-fA-F0-9]{32}$"))
                and (.identity | type == "string"))
            ' >/dev/null || { echo "Falta referencia versionada de Key Vault para APP_SECRET_ENCRYPTION_KEY"; exit 1; }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Las NEXT_PUBLIC_ TIENEN que ir como --build-arg: Next las inlinea en el
      # bundle del cliente al compilar, así que una env var del Container App
      # llega tarde — para entonces el bundle ya está hecho.
      #
      # Van como `vars` y no como `secrets` porque son públicas por definición:
      # se sirven a cualquier browser que abra la app. Si faltan, el build NO
      # falla: compila con valores vacíos y el login queda en "not-configured"
      # y el checkout de Paddle roto. Por eso el paso siguiente las verifica.
      #
      # Antes salían de .env.production, que viajaba dentro de la imagen; ese
      # archivo se sacó del contexto de build por seguridad (ver .dockerignore).
      - name: Verificar variables públicas de build
        run: |
          MISSING=""
          for V in NEXT_PUBLIC_CLIENT_ID \
                   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN \
                   NEXT_PUBLIC_PADDLE_PRO_MONTHLY \
                   NEXT_PUBLIC_PADDLE_PRO_YEARLY \
                   NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY \
                   NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY; do
            VAL=$(printenv "$V" || test "$?" -eq 1)
            [ -z "$VAL" ] && MISSING="$MISSING $V"
          done
          if [ -n "$MISSING" ]; then
            echo "Faltan variables del environment ${{ inputs.environment }} (Settings > Environments > ${{ inputs.environment }} > Variables):$MISSING"
            echo "Sin ellas el bundle se compila vacío y el login rompe en runtime."
            exit 1
          fi
        env:
          NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_PRO_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_MONTHLY }}
          NEXT_PUBLIC_PADDLE_PRO_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_YEARLY }}
          NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY }}
          NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY }}

      - name: Build & push (local runner)
        run: |
          az acr login -n "$ACR"
          [[ "$DEPLOY_ENV" =~ ^(staging|prod)$ ]] || { echo "Ambiente no permitido"; exit 1; }
          grep -Eq '^FROM node:22-alpine@sha256:[a-f0-9]{64} AS base$' Dockerfile || {
            echo "La base del commit seleccionado no esta fijada a digest"; exit 1;
          }
          TAG="$BUILD_SHA-$DEPLOY_ENV-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          REPOSITORY="$ACR.azurecr.io/$IMAGE"
          BUILD_ARGS=(
            --build-arg NEXT_PUBLIC_CLIENT_ID
            --build-arg NEXT_PUBLIC_PADDLE_CLIENT_TOKEN
            --build-arg NEXT_PUBLIC_PADDLE_PRO_MONTHLY
            --build-arg NEXT_PUBLIC_PADDLE_PRO_YEARLY
            --build-arg NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY
            --build-arg NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY
            --platform linux/amd64 --provenance=mode=min --sbom=true --push
            --label "org.opencontainers.image.revision=$BUILD_SHA"
            --cache-from "type=registry,ref=$REPOSITORY:cache-$DEPLOY_ENV"
            --cache-to "type=registry,ref=$REPOSITORY:cache-$DEPLOY_ENV,mode=max"
          )
          mkdir -p image-evidence
          # Serial builds share the builder cache; each push must succeed.
          docker buildx build "${BUILD_ARGS[@]}" --target migrator \
            -t "$REPOSITORY:$TAG-migrator" --metadata-file image-evidence/migrator-metadata.json .
          docker buildx build "${BUILD_ARGS[@]}" --target runner \
            -t "$REPOSITORY:$TAG" --metadata-file image-evidence/runtime-metadata.json .
          for TARGET in runtime migrator; do
            DIGEST=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "image-evidence/$TARGET-metadata.json")
            REF="$REPOSITORY@$DIGEST"
            docker buildx imagetools inspect "$REF" --format '{{json .SBOM}}' >"image-evidence/$TARGET-sbom.json"
            docker buildx imagetools inspect "$REF" --format '{{json .Provenance}}' >"image-evidence/$TARGET-provenance.json"
            jq -e '.. | objects | select(.spdxVersion? and .documentNamespace?)' "image-evidence/$TARGET-sbom.json" >/dev/null
            jq -e '.. | objects | select(.buildType? and .materials?)' "image-evidence/$TARGET-provenance.json" >/dev/null
            echo "${TARGET^^}_IMAGE=$REF" >>"$GITHUB_ENV"
          done
        env:
          NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_PRO_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_MONTHLY }}
          NEXT_PUBLIC_PADDLE_PRO_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_YEARLY }}
          NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY }}
          NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY }}

      - name: Smoke de los digests construidos
        run: |
          jq -n --arg sha "$BUILD_SHA" --arg environment "$DEPLOY_ENV" \
            --arg runtime "$RUNTIME_IMAGE" --arg migrator "$MIGRATOR_IMAGE" \
            --arg run "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            '{sha: $sha, environment: $environment, runtime: $runtime, migrator: $migrator, run: $run, signed: false}' \
            >image-evidence/release.json
          docker run --rm --network none --entrypoint sh "$MIGRATOR_IMAGE" -c \
            'test "$(id -u)" != 0 && test -f scripts/migrate.ts && test -d node_modules/tsx'
          NAME="runtime-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$NAME" >/dev/null' EXIT
          docker run -d --name "$NAME" --network none -e SKIP_DB_INIT=1 "$RUNTIME_IMAGE"
          for _ in $(seq 1 30); do
            if docker exec "$NAME" node -e 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              [ "$(docker exec "$NAME" id -u)" != 0 ] && exit 0
            fi
            sleep 2
          done
          echo "Runtime no respondio al health interno sin red"; exit 1

      - name: Conservar SBOM y procedencia (BuildKit, sin firma)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Migraciones
        run: |
          az containerapp job update -g "$RG" -n "$MIGRATE_JOB" \
            --image "$MIGRATOR_IMAGE"
          EXECUTION=$(az containerapp job start -g "$RG" -n "$MIGRATE_JOB" --query name -o tsv)
          [ -n "$EXECUTION" ] || { echo "Azure no devolvio nombre de ejecucion"; exit 1; }
          for _ in $(seq 1 90); do
            STATUS=$(az containerapp job execution show -g "$RG" --name "$MIGRATE_JOB" \
              --job-execution-name "$EXECUTION" --query properties.status -o tsv)
            [ "$STATUS" = "Succeeded" ] && exit 0
            [ "$STATUS" = "Failed" ] && { echo "Migración falló"; exit 1; }
            sleep 10
          done
          echo "Timeout esperando la migración"; exit 1

      - name: Deploy de la app
        run: |
          # APP_VERSION va por --set-env-vars y NO por --build-arg: un build-arg
          # que cambia en cada commit invalida el cache de la etapa `builder`
          # justo antes de `npm run build`, que es lo que hacía los deploys de
          # 20-60 min. Como env var de runtime el cache no se entera.
          az containerapp update -g "$RG" -n "$APP" \
            --image "$RUNTIME_IMAGE" \
            --set-env-vars AZURE_SENDER_EMAIL_ALERTS="${{ vars.AZURE_SENDER_EMAIL_ALERTS || 'alerts@cscloudsolutions.com.ar' }}" \
                           APP_VERSION="${{ inputs.sha }}"
          OBSERVED=$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].image' -o tsv)
          [ "$OBSERVED" = "$RUNTIME_IMAGE" ] || { echo "La imagen observada no coincide con el digest construido"; exit 1; }

      - name: Health check
        run: |
          FQDN=$(az containerapp show -g "$RG" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for _ in $(seq 1 30); do
            code=$(curl -s --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "https://$FQDN/api/health" || true)
            [ "$code" = "200" ] && exit 0
            # 403 = el origen sólo acepta IPs de Cloudflare (allowed_ip_ranges):
            # este runner no puede entrar por el FQDN de Azure, y eso NO es una
            # falla del deploy. Se confía entonces en la sonda de readiness de la
            # plataforma, que pega al mismo /api/health por dentro: la revisión
            # nueva tiene que estar Healthy y Running. Sin el filtro de IP este
            # camino no se ejecuta nunca.
            if [ "$code" = "403" ]; then
              REV=$(az containerapp show -g "$RG" -n "$APP" \
                --query properties.latestRevisionName -o tsv || true)
              ESTADO=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REV" \
                --query "join(' ', [properties.healthState, properties.runningState])" -o tsv || true)
              if [ "$ESTADO" = "Healthy Running" ]; then
                echo "El origen filtra por IP (403); la revisión $REV está $ESTADO."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Health check falló — revisar la revisión y hacer rollback"; exit 1
