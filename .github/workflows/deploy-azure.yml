# Deploy a Azure Container Apps. REEMPLAZA al deploy por SSH al VPS.
#
# Diferencias con el anterior:
# - El build ocurre en ACR, no en el VPS (adiós al downtime del build).
# - Las migraciones corren como Container App Job, no por SSH.
# - No hay SSH_PRIVATE_KEY: OIDC federado. De paso desaparece el problema de
#   fail2ban baneando los runners de GitHub Actions que documenta
#   el plan de infraestructura del VPS (eliminado el 2026-09-01).
# - Rollback = activar la revisión anterior, sin rebuild.
#
# Nombres verificados contra el stamp real el 2026-07-28. Salen de
# `terraform output` en infra/terraform/environments/prod:
#   acr_login_server, web_apps, migrate_jobs
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '.github/workflows/**'
      - '**.md'
      # Los tests no se despliegan: la etapa `runner` del Dockerfile copia solo
      # public/, .next/standalone y .next/static, asi que __tests__ nunca llega
      # a la imagen que sirve prod. Y como la etapa `builder` hace `COPY . .`,
      # tocar un test invalidaba esa capa y forzaba el `npm run build` completo:
      # un cambio de test costaba el deploy entero (9 min medidos el 2026-09-07)
      # para producir una revision funcionalmente identica.
      #
      # ci.yml NO los ignora, asi que un push de tests sigue corriendo la suite.
      # Un push que toque src/ y tests a la vez despliega igual: paths-ignore
      # evalua todos los archivos del push, no cada uno por separado.
      - '__tests__/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
  workflow_dispatch:

# Mínimo a nivel de workflow; `id-token: write` lo pide sólo el job `deploy`, que
# es el único que hace `azure/login`.
#
# Antes estaba acá, y entonces lo heredaba `verificacion`: el job que corre
# `npm ci` y la suite de tests, o sea código de cientos de dependencias de npm,
# en un push a main. Cualquier proceso de ese job podía pedir un token OIDC con
# sujeto `ref:refs/heads/main`, que el service principal de Terraform acepta
# (credencial `gh-main`) con Contributor y User Access Administrator sobre la
# suscripción. Un `postinstall` malicioso en una dependencia llegaba a Azure.
permissions:
  contents: read

concurrency:
  group: deploy-prod
  # Queda en false a proposito, y conviene no tocarlo. Cancelar el job de
  # Actions no cancela lo que ya se disparo en Azure: `az containerapp job
  # start` sobre el job de migracion es fire-and-forget, y lo unico que
  # cancelariamos es el poll que espera su resultado. La migracion sigue
  # corriendo contra la base mientras el deploy siguiente arranca la suya,
  # dos migraciones en paralelo sobre el mismo MySQL. Con false el segundo
  # push espera en cola, que es lo que queremos.
  # En ci.yml si esta en true: ahi cancelar no deja nada a medias.
  cancel-in-progress: false

env:
  ACR: cscsfinopsprodglobalcr
  IMAGE: finops
  RG: cscs-finops-prod-westus2-rg
  APP: cscs-finops-prod-westus2-web
  MIGRATE_JOB: cscs-finops-prod-wus2-migrate
  # Tag aparte para las migraciones: la imagen de runtime es un standalone de
  # Next podado y NO puede correr `npm run migrate` (no tiene scripts/, ni
  # migrations/, ni tsx). Este tag se construye con --target builder.
  MIGRATE_TAG_SUFFIX: builder

jobs:
  # PUERTA DE CALIDAD (2026-09-22). Antes no habia ninguna.
  #
  # Este workflow dispara con `on: push` igual que ci.yml, sin `needs:` ni
  # `workflow_run`, asi que los dos arrancaban EN PARALELO: con la suite en rojo
  # produccion se actualizaba lo mismo y CI avisaba despues, con el codigo ya
  # arriba. Y la ventana era comoda para no enterarse: CI tarda ~3 min y el
  # deploy ~13.
  #
  # Peor de lo que parece: en push a main ci.yml corre SOLO este job. `lint`,
  # `typecheck` y `build` estan los tres con `if: github.event_name ==
  # 'pull_request'`. O sea que lo unico que separa un merge a main de produccion
  # son estos tests.
  #
  # POR QUE SE CORRE LA SUITE ACA Y NO SE ESPERA LA DE ci.yml
  #
  # Un gate que consulta el resultado de otro workflow tiene que resolver el caso
  # "la corrida todavia no existe", y ahi o se cuelga o deja pasar. Deja pasar =
  # falla ABIERTO, que es exactamente lo que no puede hacer una puerta. Esto es
  # determinista y falla cerrado.
  #
  # La otra opcion era `workflow_run`, y se descarto porque pierde el
  # `paths-ignore` de arriba: cada push de tests dispararia un deploy completo de
  # 9 min para producir una revision identica, que es justo lo que ese filtro
  # arregla. Mover el deploy adentro de ci.yml obliga a reimplementar ese filtro
  # a mano, y esa logica no conviene tenerla escrita dos veces.
  #
  # Cuesta ~3 min de runner duplicados por deploy. Es el precio de que la puerta
  # no tenga partes moviles.
  verificacion:
    name: Lint + typecheck + tests (puerta del deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      # Typecheck primero: es mas barato que la suite y si los tipos no cierran
      # lo que digan los tests importa poco. Va en ESTE job y no en uno aparte
      # para reusar el `npm ci`, que cuesta mas que el chequeo mismo.
      #
      # Igual que el de tests, no estaba cubierto en push a main: el `typecheck`
      # de ci.yml corre solo en pull_request. Un error de compilacion si llegaba
      # a frenarse --el build de ACR lo agarra durante el deploy-- pero recien
      # ahi, con los ~8 min del build ya gastados; y `tsc --noEmit` ve cosas que
      # `next build` no, porque el build solo compila lo que entra en el bundle.
      - run: npm run typecheck -- --pretty false
      # El lint SI hace falta aca, aunque `ci.yml` ya lo corra: alli esta
      # condicionado a `pull_request`, y en este repo se pushea directo a main.
      # Por ese camino no lo corria NADIE, asi que
      # `react-hooks/rules-of-hooks` --que se subio a error el 2026-09-23 porque
      # un hook despues de un corte temprano tira la pantalla entera-- frenaba
      # un PR y no frenaba un push. Es el camino que se usa.
      #
      # `--quiet` porque los ~3.400 warnings de deuda no son gate (ver MEJ-09 y
      # docs/lint-debt.md); lo que corta son los errores.
      - run: npm run lint -- --quiet
      - name: Run tests
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json
        env:
          CI: true
      # Mismo motivo que en ci.yml: sin el artefacto, un fallo intermitente se
      # pierde con el scroll y despues no se puede saber que test fue.
      - name: Upload test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-deploy
          path: vitest-report.json
          retention-days: 14

  deploy:
    needs: verificacion
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Las NEXT_PUBLIC_ TIENEN que ir como --build-arg: Next las inlinea en el
      # bundle del cliente al compilar, así que una env var del Container App
      # llega tarde — para entonces el bundle ya está hecho.
      #
      # Van como `vars` y no como `secrets` porque son públicas por definición:
      # se sirven a cualquier browser que abra la app. Si faltan, el build NO
      # falla: compila con valores vacíos y el login queda en "not-configured"
      # y el checkout de Paddle roto. Por eso el paso siguiente las verifica.
      #
      # Antes salían de .env.production, que viajaba dentro de la imagen; ese
      # archivo se sacó del contexto de build por seguridad (ver .dockerignore).
      - name: Verificar variables públicas de build
        run: |
          MISSING=""
          for V in NEXT_PUBLIC_CLIENT_ID \
                   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN \
                   NEXT_PUBLIC_PADDLE_PRO_MONTHLY \
                   NEXT_PUBLIC_PADDLE_PRO_YEARLY \
                   NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY \
                   NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY; do
            eval "VAL=\${$V}"
            [ -z "$VAL" ] && MISSING="$MISSING $V"
          done
          if [ -n "$MISSING" ]; then
            echo "Faltan variables de repositorio (Settings > Variables):$MISSING"
            echo "Sin ellas el bundle se compila vacío y el login rompe en runtime."
            exit 1
          fi
        env:
          NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
          NEXT_PUBLIC_PADDLE_PRO_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_MONTHLY }}
          NEXT_PUBLIC_PADDLE_PRO_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_PRO_YEARLY }}
          NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY: ${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY }}
          NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY: ${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY }}

      - name: Build & push (local runner)
        run: |
          az acr login -n "$ACR"
          
          # Descargar imágenes para usar como caché (ignorando fallos si no existen)
          docker pull "$ACR.azurecr.io/$IMAGE:latest" || true
          docker pull "$ACR.azurecr.io/$IMAGE:$MIGRATE_TAG_SUFFIX" || true
          
          # Las dos imagenes comparten la etapa `builder`, que es la que corre
          # `npm run build` (compilacion de Next + tsc). Antes se construian en
          # PARALELO con `&`, y como son dos invocaciones independientes de
          # docker build ninguna veia el cache de la otra: la etapa se ejecutaba
          # DOS VECES, peleando por los 2 vCPU del runner. En el log se veia
          # `#16 [builder 4/4] RUN npm run build` y `#20 [builder 4/4] RUN npm
          # run build` compilando a la par, 3.6 y 3.7 min cada una, y despues
          # dos pasadas de TypeScript — de ahi los builds de 20 a 60 min y los
          # runners que se caian a mitad de camino.
          #
          # Ahora van en serie y la de migraciones va PRIMERO: al terminar deja
          # `builder` en el cache local, y el build de runtime lo reusa entero.
          # Los --build-arg tienen que ser identicos en las dos o el cache no
          # matchea; antes la de migraciones no recibia ninguna NEXT_PUBLIC_.
          BUILD_ARGS=(
            --build-arg BUILDKIT_INLINE_CACHE=1
            --build-arg NEXT_PUBLIC_CLIENT_ID="${{ vars.NEXT_PUBLIC_CLIENT_ID }}"
            --build-arg NEXT_PUBLIC_PADDLE_CLIENT_TOKEN="${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}"
            --build-arg NEXT_PUBLIC_PADDLE_PRO_MONTHLY="${{ vars.NEXT_PUBLIC_PADDLE_PRO_MONTHLY }}"
            --build-arg NEXT_PUBLIC_PADDLE_PRO_YEARLY="${{ vars.NEXT_PUBLIC_PADDLE_PRO_YEARLY }}"
            --build-arg NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY="${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_MONTHLY }}"
            --build-arg NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY="${{ vars.NEXT_PUBLIC_PADDLE_BUSINESS_YEARLY }}"
          )

          docker build \
            -t "$ACR.azurecr.io/$IMAGE:${{ github.sha }}-$MIGRATE_TAG_SUFFIX" \
            -t "$ACR.azurecr.io/$IMAGE:$MIGRATE_TAG_SUFFIX" \
            --cache-from "$ACR.azurecr.io/$IMAGE:$MIGRATE_TAG_SUFFIX" \
            "${BUILD_ARGS[@]}" \
            --target builder \
            -f Dockerfile . \
            || { echo "Build de imagen de migraciones falló"; exit 1; }

          docker build \
            -t "$ACR.azurecr.io/$IMAGE:${{ github.sha }}" \
            -t "$ACR.azurecr.io/$IMAGE:latest" \
            --cache-from "$ACR.azurecr.io/$IMAGE:latest" \
            "${BUILD_ARGS[@]}" \
            -f Dockerfile . \
            || { echo "Build de runtime falló"; exit 1; }

          # Push en paralelo: son subidas de red, no compilan nada.
          docker push "$ACR.azurecr.io/$IMAGE:${{ github.sha }}" &
          docker push "$ACR.azurecr.io/$IMAGE:latest" &
          docker push "$ACR.azurecr.io/$IMAGE:${{ github.sha }}-$MIGRATE_TAG_SUFFIX" &
          docker push "$ACR.azurecr.io/$IMAGE:$MIGRATE_TAG_SUFFIX" &
          wait

      - name: Migraciones
        run: |
          az containerapp job update -g "$RG" -n "$MIGRATE_JOB" \
            --image "$ACR.azurecr.io/$IMAGE:${{ github.sha }}-$MIGRATE_TAG_SUFFIX"
          az containerapp job start -g "$RG" -n "$MIGRATE_JOB"
          for i in $(seq 1 90); do
            STATUS=$(az containerapp job execution list -g "$RG" --name "$MIGRATE_JOB" \
              --query "[0].properties.status" -o tsv)
            [ "$STATUS" = "Succeeded" ] && exit 0
            [ "$STATUS" = "Failed" ] && { echo "Migración falló"; exit 1; }
            sleep 10
          done
          echo "Timeout esperando la migración"; exit 1

      - name: Deploy de la app
        run: |
          # APP_VERSION va por --set-env-vars y NO por --build-arg: un build-arg
          # que cambia en cada commit invalida el cache de la etapa `builder`
          # justo antes de `npm run build`, que es lo que hacía los deploys de
          # 20-60 min. Como env var de runtime el cache no se entera.
          az containerapp update -g "$RG" -n "$APP" \
            --image "$ACR.azurecr.io/$IMAGE:${{ github.sha }}" \
            --set-env-vars AZURE_SENDER_EMAIL_ALERTS="${{ vars.AZURE_SENDER_EMAIL_ALERTS || 'alerts@cscloudsolutions.com.ar' }}" \
                           APP_VERSION="${{ github.sha }}"

      - name: Health check
        run: |
          FQDN=$(az containerapp show -g "$RG" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/api/health" || true)
            [ "$code" = "200" ] && exit 0
            # 403 = el origen sólo acepta IPs de Cloudflare (allowed_ip_ranges):
            # este runner no puede entrar por el FQDN de Azure, y eso NO es una
            # falla del deploy. Se confía entonces en la sonda de readiness de la
            # plataforma, que pega al mismo /api/health por dentro: la revisión
            # nueva tiene que estar Healthy y Running. Sin el filtro de IP este
            # camino no se ejecuta nunca.
            if [ "$code" = "403" ]; then
              REV=$(az containerapp show -g "$RG" -n "$APP" \
                --query properties.latestRevisionName -o tsv || true)
              ESTADO=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$REV" \
                --query "join(' ', [properties.healthState, properties.runningState])" -o tsv || true)
              if [ "$ESTADO" = "Healthy Running" ]; then
                echo "El origen filtra por IP (403); la revisión $REV está $ESTADO."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Health check falló — revisar la revisión y hacer rollback"; exit 1
