# Promoción manual de la revisión en pruebas a producción.
#
# `deploy-azure.yml` deja cada build nuevo como revisión con la etiqueta
# `testing` y CERO tráfico. Este workflow es el "OK" explícito: intercambia las
# etiquetas, con lo que `produccion` pasa a apuntar a la revisión validada y
# `testing` queda apuntando a la que estaba en producción hasta recién.
#
# Ese intercambio es lo que hace el rollback trivial: volver atrás es ejecutar
# este mismo workflow otra vez, porque `testing` ya es la revisión anterior.
name: Promover a producción

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribir "promover" para confirmar el cambio de tráfico'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  # Comparte grupo con el deploy: promover mientras se está creando una revisión
  # nueva dejaría las etiquetas apuntando a algo distinto de lo que se validó.
  group: deploy-prod
  cancel-in-progress: false

env:
  ACR: cscsfinopsprodglobalcr
  IMAGE: finops
  RG: cscs-finops-prod-westus2-rg
  APP: cscs-finops-prod-westus2-web

jobs:
  promover:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Validar confirmación
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "promover" ]; then
            echo "Hay que escribir exactamente 'promover' para continuar."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Comprobar que hay algo para promover
        run: |
          REV_TESTING=$(az containerapp show -g "$RG" -n "$APP" \
            --query "properties.configuration.ingress.traffic[?label=='testing'].revisionName | [0]" -o tsv)
          if [ -z "$REV_TESTING" ] || [ "$REV_TESTING" = "None" ]; then
            echo "No hay ninguna revisión con la etiqueta 'testing'."
            exit 1
          fi

          # La revisión tiene que estar sana ANTES de mandarle usuarios: si está
          # degradada, el swap la pondría al 100% y se convierte en una caída.
          ESTADO=$(az containerapp revision show -g "$RG" -n "$APP" \
            --revision "$REV_TESTING" --query "properties.healthState" -o tsv)
          if [ "$ESTADO" != "Healthy" ]; then
            echo "La revisión $REV_TESTING está en estado '$ESTADO', no se promueve."
            exit 1
          fi

          IMG=$(az containerapp revision show -g "$RG" -n "$APP" \
            --revision "$REV_TESTING" --query "properties.template.containers[0].image" -o tsv)
          echo "REV_TESTING=$REV_TESTING" >> "$GITHUB_ENV"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Intercambiar etiquetas (testing <-> produccion)
        run: |
          az containerapp revision label swap -g "$RG" -n "$APP" \
            --source testing --target produccion

      # Recién ahora los cron jobs pasan a la imagen nueva: hasta este punto
      # seguían corriendo la que estaba en producción, para que una revisión sin
      # aprobar nunca toque los datos reales en segundo plano.
      - name: Actualizar los cron jobs a la imagen promovida
        run: |
          JOBS=$(az containerapp job list -g "$RG" \
              --query "[?properties.configuration.triggerType=='Schedule'].name" -o tsv)
          if [ -n "$JOBS" ]; then
            echo "$JOBS" | xargs -P 8 -I {} sh -c 'echo "-> {}" && az containerapp job update -g "'"$RG"'" -n "{}" --image "'"$IMG"'"'
          fi

      - name: Desactivar revisiones viejas
        run: |
          # Cada revisión activa mantiene sus réplicas (min_replicas) corriendo y
          # facturando, aunque reciba 0% del tráfico. Sin esta limpieza el costo
          # crece con cada deploy. Se conservan las dos etiquetadas: `produccion`
          # (sirviendo) y `testing` (la anterior, que es el rollback).
          CONSERVAR=$(az containerapp show -g "$RG" -n "$APP" \
            --query "properties.configuration.ingress.traffic[?label!=null].revisionName" -o tsv)
          echo "Se conservan: $CONSERVAR"

          ACTIVAS=$(az containerapp revision list -g "$RG" -n "$APP" \
            --query "[?properties.active].name" -o tsv)

          for REV in $ACTIVAS; do
            if echo "$CONSERVAR" | grep -qx "$REV"; then continue; fi
            echo "-> desactivando $REV"
            az containerapp revision deactivate -g "$RG" -n "$APP" --revision "$REV" || true
          done

      - name: Health check de producción
        run: |
          FQDN=$(az containerapp show -g "$RG" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$FQDN/api/health" || true)
            [ "$code" = "200" ] && break
            [ "$i" = "30" ] && {
              echo "Producción no responde. Volver atrás ejecutando este mismo"
              echo "workflow de nuevo: 'testing' quedó apuntando a la revisión anterior."
              exit 1
            }
            sleep 10
          done
          {
            echo "### Promovido a producción"
            echo ""
            echo "- Revisión ahora en \`produccion\`: \`$REV_TESTING\`"
            echo "- Imagen: \`$IMG\`"
            echo ""
            echo "Para revertir, ejecutar este workflow otra vez: la etiqueta"
            echo "\`testing\` quedó apuntando a la revisión anterior."
          } >> "$GITHUB_STEP_SUMMARY"
