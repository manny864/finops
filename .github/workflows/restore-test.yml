# Prueba del runbook de restore (docs/runbook-restore-mysql.md §4.3)
# Restaura el último dump en una DB de prueba (finops_restore_test) y la borra.
# NO toca la DB productiva ni la app. Disparo manual (workflow_dispatch).
name: Restore Test (runbook §4.3)
on:
  workflow_dispatch:

jobs:
  restore-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run restore test on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 5m
          command_timeout: 15m
          script: |
            set -e
            FINOPS=~/cscloud/finops
            DBDIR=~/cscloud/database
            DB_PASS=$(grep '^DB_PASSWORD=' $FINOPS/.env | cut -d= -f2- | tr -d '"')
            DB_NAME=$(grep '^DB_NAME=' $FINOPS/.env | cut -d= -f2- | tr -d '"')
            ROOT_PASS=$(grep '^MYSQL_ROOT_PASSWORD=' $DBDIR/.env 2>/dev/null | cut -d= -f2- | tr -d '"')
            ROOT_PASS=${ROOT_PASS:-$DB_PASS}

            DUMP=$(ls -t $FINOPS/backups/daily/*.sql.gz | head -1)
            echo "Dump elegido: $DUMP ($(du -h "$DUMP" | cut -f1))"
            gunzip -t "$DUMP" && echo "Integridad gzip: OK"

            cd $DBDIR
            docker compose exec -T mysql env MYSQL_PWD="$ROOT_PASS" mysql -uroot \
              -e "DROP DATABASE IF EXISTS finops_restore_test; CREATE DATABASE finops_restore_test;"

            START=$(date +%s)
            gunzip -c "$DUMP" | docker compose exec -T mysql \
              env MYSQL_PWD="$ROOT_PASS" mysql -uroot finops_restore_test
            echo "Duración del restore: $(( $(date +%s) - START ))s"

            # Sanity check: tablas restauradas vs DB real, y tenants > 0
            docker compose exec -T mysql env MYSQL_PWD="$ROOT_PASS" mysql -uroot -e "
              SELECT
                (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='finops_restore_test') AS tablas_restauradas,
                (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$DB_NAME') AS tablas_produccion;
              SELECT COUNT(*) AS tenants FROM finops_restore_test.Tenants;"

            docker compose exec -T mysql env MYSQL_PWD="$ROOT_PASS" mysql -uroot \
              -e "DROP DATABASE finops_restore_test;"
            echo "=== RESTORE TEST OK ==="
