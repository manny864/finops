# INFRA-05 — Reconciliador del firewall del Key Vault.
#
# terraform.yml abre la IP de su runner en el firewall del vault y la cierra con
# `if: always()`. Eso no cubre un runner perdido ni una terminación forzada, y Key
# Vault no tiene TTL para una IP rule. Por eso la apertura deja antes un lease con
# vencimiento (blob `kv-firewall-leases/<vault>/<ip>/<job>` en el contenedor del
# tfstate) y este workflow, en otro runner y por su cuenta, quita las reglas /32
# que no son permanentes (keyvault_allowed_ip_rules del tfvars) y no tienen lease
# vigente.
#
# SLA de cierre ante runner perdido: TTL del lease (timeout del job + 10 min: 70 en
# plan-apply, 40 en drift) + período de este cron (15 min, más el retraso que
# GitHub le agregue al schedule). Una falla al quitar una regla deja este workflow
# en rojo (alerta), nunca éxito silencioso. Lógica y pruebas:
# infra/scripts/kv-firewall-lease.sh y __tests__/unit/kvFirewallLeaseInfra05.test.ts.
name: kv-firewall-reconcile

on:
  schedule:
    - cron: '*/15 * * * *'
  # Limpieza rápida apenas termina (o se cancela) una corrida de Terraform. No
  # reemplaza al cron: si ese evento no llega, el cron igual pasa.
  workflow_run:
    workflows: [terraform]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mismo subject OIDC (`environment:<env>`) y mismos secrets/vars que plan-apply.
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: kv-firewall-reconcile-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: [prod, staging]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform init
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate"
      # Reglas PERMANENTES = `keyvault_allowed_ip_rules` de cada stamp en el tfvars del
      # ambiente (la fuente de verdad, no el último apply). Se evalúa con `terraform console`
      # en un directorio aparte que sólo tiene variables.tf: sin backend, sin state (no toma
      # el lock que puede tener un plan/apply en curso) y sin providers.
      - name: Leer reglas permanentes del tfvars
        id: permanent
        env:
          AMBIENTE: ${{ matrix.environment }}
          TF_VARS_STAGING: ${{ secrets.TF_VARS }}
          TF_VARS_PROD_VALOR: ${{ matrix.environment != 'staging' && secrets.TF_VARS_PROD || '' }}
        run: |
          D=$(mktemp -d)
          cp -L variables.tf cron-jobs.tfvars "$D"/
          if [ "$AMBIENTE" = "staging" ]; then VALOR="$TF_VARS_STAGING"; else VALOR="$TF_VARS_PROD_VALOR"; fi
          if [ -z "$VALOR" ]; then
            echo "::warning::Sin tfvars de $AMBIENTE: no se sabe qué reglas son permanentes."
            exit 0
          fi
          printf '%s\n' "$VALOR" > "$D/terraform.tfvars"
          cd "$D"
          terraform init -input=false -backend=false >/dev/null
          if PERM=$(echo 'jsonencode({ for k, s in var.stamps : k => s.keyvault_allowed_ip_rules })' \
              | terraform console -var-file=terraform.tfvars -var-file=cron-jobs.tfvars | jq -r .) \
             && jq -e 'type == "object"' <<< "$PERM" >/dev/null; then
            echo "$PERM" > "$RUNNER_TEMP/kv-permanent-by-stamp.json"
            echo "known=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No se pudo evaluar keyvault_allowed_ip_rules de $AMBIENTE."
          fi
          rm -rf "$D"

      - name: Quitar reglas temporales vencidas o huérfanas
        env:
          LEASE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE }}
          LEASE_CONTAINER: ${{ vars.TFSTATE_CONTAINER || 'tfstate' }}
          PERMANENT_KNOWN_STEP: ${{ steps.permanent.outputs.known }}
        run: |
          NAMES=$(terraform output -json key_vault_names 2>/dev/null || echo '{}')
          VAULTS=$(jq -r '.[]?' <<< "$NAMES" | tr '\n' ' ')
          if [ -z "${VAULTS// }" ]; then
            echo "Sin key_vault_names en el state de ${{ matrix.environment }} — nada que reconciliar."
            exit 0
          fi
          # Líneas "<vault> <ip|cidr>": stamp → vault por el output del state, stamp → reglas por el tfvars.
          PERMANENT_FILE=$(mktemp)
          if [ "$PERMANENT_KNOWN_STEP" = 1 ]; then
            jq -r --slurpfile perm "$RUNNER_TEMP/kv-permanent-by-stamp.json" \
              'to_entries[] | .value as $v | ($perm[0][.key] // [])[] | "\($v) \(.)"' <<< "$NAMES" > "$PERMANENT_FILE"
            export PERMANENT_KNOWN=1
          fi
          VAULTS="$VAULTS" PERMANENT_FILE="$PERMANENT_FILE" \
            "$GITHUB_WORKSPACE/infra/scripts/kv-firewall-lease.sh" reconcile
