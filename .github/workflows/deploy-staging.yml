name: Deploy to Staging

# Trigger: Push a rama 'staging'
on:
  push:
    branches: [staging]
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.webp'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  ACR: cscsfinopsprodglobalcr  # ACR COMPARTIDO CON PROD
  IMAGE: finops
  RG: cscs-finops-stg-westus2-rg
  APP: cscs-finops-stg-westus2-web
  MIGRATE_JOB: cscs-finops-stg-wus2-migrate
  MIGRATE_TAG_SUFFIX: builder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Linter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund --prefer-offline --loglevel=error
      - run: npm run lint -- --quiet
      - run: npm run typecheck -- --pretty false
      
      # Tests (staging puede fallar tests y deployar igual si el usuario lo permite)
      - run: npm run test:coverage
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Variables públicas de build (NEXT_PUBLIC_*)
      - name: Verificar variables de build
        env:
          NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
        run: |
          MISSING=""
          for V in NEXT_PUBLIC_CLIENT_ID \
                   NEXT_PUBLIC_PADDLE_CLIENT_TOKEN; do
            eval "VAL=\${$V}"
            [ -z "$VAL" ] && MISSING="$MISSING $V"
          done
          if [ ! -z "$MISSING" ]; then
            echo "❌ Variables faltantes: $MISSING"
            exit 1
          fi

      # Build en ACR (runtime + builder)
      - name: Build & Push runtime image
        id: build
        run: |
          TAG="staging-${{ github.sha }}"
          az acr build \
            --registry $ACR \
            --image $IMAGE:$TAG \
            --image $IMAGE:staging-latest \
            --build-arg NEXT_PUBLIC_CLIENT_ID="${{ vars.NEXT_PUBLIC_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_PADDLE_CLIENT_TOKEN="${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}" \
            .
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push migration image (builder)
        run: |
          TAG="staging-${{ github.sha }}-$MIGRATE_TAG_SUFFIX"
          az acr build \
            --registry $ACR \
            --image $IMAGE:$TAG \
            --target builder \
            .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve staging resources
        id: resolve
        run: |
          RESOLVED_SUB=""
          RESOLVED_SUB_NAME=""
          RESOLVED_RG=""
          APP_NAME=""
          JOB_NAME=""

          try_resolve_in_subscription() {
            local sub_id="$1"
            az account set -s "$sub_id" >/dev/null

            local sub_name
            sub_name=$(az account show --query name -o tsv)
            echo "Checking subscription: $sub_name ($sub_id)"

            local rg_candidate="$RG"
            if [ "$(az group exists -n "$rg_candidate")" != "true" ]; then
              rg_candidate=$(az group list --query "[?contains(name, 'finops') && contains(name, 'stg') && contains(name, 'westus2')][0].name" -o tsv)
            fi
            [ -z "$rg_candidate" ] && return 1

            local app_candidate="$APP"
            if ! az containerapp show -n "$app_candidate" -g "$rg_candidate" >/dev/null 2>&1; then
              app_candidate=$(az containerapp list -g "$rg_candidate" --query "[?contains(name, 'web')][0].name" -o tsv)
            fi
            [ -z "$app_candidate" ] && return 1

            local job_candidate="$MIGRATE_JOB"
            if ! az containerapp job show -n "$job_candidate" -g "$rg_candidate" >/dev/null 2>&1; then
              job_candidate=$(az containerapp job list -g "$rg_candidate" --query "[?contains(name, 'migrate')][0].name" -o tsv)
            fi
            [ -z "$job_candidate" ] && return 1

            RESOLVED_SUB="$sub_id"
            RESOLVED_SUB_NAME="$sub_name"
            RESOLVED_RG="$rg_candidate"
            APP_NAME="$app_candidate"
            JOB_NAME="$job_candidate"
            return 0
          }

          DEFAULT_SUB=$(az account show --query id -o tsv)
          if ! try_resolve_in_subscription "$DEFAULT_SUB"; then
            while read -r SUB; do
              [ -z "$SUB" ] && continue
              [ "$SUB" = "$DEFAULT_SUB" ] && continue
              if try_resolve_in_subscription "$SUB"; then
                break
              fi
            done < <(az account list --query "[].id" -o tsv)
          fi

          if [ -z "$RESOLVED_SUB" ]; then
            echo "❌ Could not resolve staging Container App + migration job in available subscriptions."
            echo "Visible subscriptions:"
            az account list --query "[].{name:name,id:id}" -o table || true
            exit 1
          fi

          az account set -s "$RESOLVED_SUB" >/dev/null
          echo "Resolved: $RESOLVED_SUB_NAME ($RESOLVED_SUB), RG=$RESOLVED_RG, APP=$APP_NAME, JOB=$JOB_NAME"
          echo "subscription_id=$RESOLVED_SUB" >> $GITHUB_OUTPUT
          echo "resource_group=$RESOLVED_RG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "job_name=$JOB_NAME" >> $GITHUB_OUTPUT

      # Ejecutar migraciones (Container App Job)
      - name: Run database migrations
        run: |
          IMAGE_TAG="staging-${{ github.sha }}-$MIGRATE_TAG_SUFFIX"
          SUB_ID="${{ steps.resolve.outputs.subscription_id }}"
          RESOLVED_RG="${{ steps.resolve.outputs.resource_group }}"
          JOB_NAME="${{ steps.resolve.outputs.job_name }}"
          az account set -s "$SUB_ID" >/dev/null
          
          # Actualizar la imagen del job
          az containerapp job update \
            -n $JOB_NAME \
            -g $RESOLVED_RG \
            --image $ACR.azurecr.io/$IMAGE:$IMAGE_TAG
          
          # Ejecutar el job
          EXEC_NAME=$(az containerapp job start \
            -n $JOB_NAME \
            -g $RESOLVED_RG \
            --query name -o tsv)
          
          if [ -z "$EXEC_NAME" ]; then
            echo "❌ Could not resolve migration execution name."
            exit 1
          fi

          echo "Migration job started: $EXEC_NAME"
          
          # Esperar a que termine (max 15 min)
          DEADLINE=$((SECONDS + 900))
          while [ $SECONDS -lt $DEADLINE ]; do
            STATUS=$(az containerapp job execution show \
              -n "$JOB_NAME" \
              -g "$RESOLVED_RG" \
              --job-execution-name "$EXEC_NAME" \
              --query "coalesce(properties.status, status, properties.provisioningState)" \
              -o tsv 2>/dev/null || true)

            if [ -z "$STATUS" ]; then
              STATUS=$(az containerapp job execution list \
                -n "$JOB_NAME" \
                -g "$RESOLVED_RG" \
                --query "[?name=='$EXEC_NAME'] | [0].properties.status" \
                -o tsv 2>/dev/null || true)
            fi

            case "$STATUS" in
              Completed|Succeeded)
                echo "✓ Migrations completed ($STATUS)"
                exit 0
                ;;
              Failed)
                echo "✗ Migrations failed"
                exit 1
                ;;
            esac

            echo "Status: ${STATUS:-unknown}. Waiting..."
            sleep 10
          done

          echo "✗ Migration timeout after 15 minutes"
          exit 1

      # Actualizar Container App (web)
      - name: Update Container App
        run: |
          IMAGE_TAG="staging-${{ github.sha }}"
          SUB_ID="${{ steps.resolve.outputs.subscription_id }}"
          RESOLVED_RG="${{ steps.resolve.outputs.resource_group }}"
          APP_NAME="${{ steps.resolve.outputs.app_name }}"
          az account set -s "$SUB_ID" >/dev/null
          
          az containerapp update \
            -n $APP_NAME \
            -g $RESOLVED_RG \
            --image $ACR.azurecr.io/$IMAGE:$IMAGE_TAG

      # Health check
      - name: Health check
        run: |
          SUB_ID="${{ steps.resolve.outputs.subscription_id }}"
          RESOLVED_RG="${{ steps.resolve.outputs.resource_group }}"
          APP_NAME="${{ steps.resolve.outputs.app_name }}"
          az account set -s "$SUB_ID" >/dev/null
          HOSTNAME=$(az containerapp show \
            -n $APP_NAME \
            -g $RESOLVED_RG \
            --query 'properties.latestRevisionFqdn' -o tsv)
          
          echo "Checking $HOSTNAME..."
          
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://$HOSTNAME/status || echo 000)
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "307" ] || [ "$HTTP_CODE" = "308" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            
            echo "Attempt $i: HTTP $HTTP_CODE. Waiting..."
            sleep 10
          done
          
          echo "✗ Health check failed after 5 minutes"
          exit 1

      # Notificación
      - name: Deployment notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SUB_ID="${{ steps.resolve.outputs.subscription_id }}"
          RESOLVED_RG="${{ steps.resolve.outputs.resource_group }}"
          APP_NAME="${{ steps.resolve.outputs.app_name }}"
          [ -z "$RESOLVED_RG" ] && RESOLVED_RG="$RG"
          [ -z "$APP_NAME" ] && APP_NAME="$APP"
          [ ! -z "$SUB_ID" ] && az account set -s "$SUB_ID" >/dev/null || true
          HOSTNAME=$(az containerapp show \
            -n $APP_NAME \
            -g $RESOLVED_RG \
            --query 'properties.latestRevisionFqdn' -o tsv 2>/dev/null || true)
          [ -z "$HOSTNAME" ] && HOSTNAME="N/A"
          
          echo "## Staging Deployment $STATUS ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: staging" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://$HOSTNAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: $ACR.azurecr.io/$IMAGE:staging-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
