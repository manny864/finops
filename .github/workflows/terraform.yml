# Copiar a .github/workflows/terraform.yml
#
# Autenticación por OIDC (federated credential sobre este repo). No hay
# secrets de cliente ni llaves SSH: `azure/login` obtiene un token de corta
# vida.
#
# El PR corre análisis estático + costo + plan. El apply es SIEMPRE manual.
name: terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a desplegar
        required: true
        default: prod
        type: choice
        # prod y staging. environments/dev/ tiene terraform.tfvars.example pero no
        # terraform.tfvars, asi que un plan sobre dev falla en el -var-file antes
        # de llegar a Azure: sigue sin ofrecerse. staging comparte el codigo de prod
        # (enlaces en environments/staging) y se aplica con su propia palabra.
        options: [prod, staging]
      confirm:
        description: 'Para APLICAR, escribir exactamente: APPLY-PROD (ambiente prod) o APPLY-STAGING (ambiente staging). Vacio = solo plan'
        required: false
        default: ''
        type: string
      replace:
        # Existe por una limitacion del provider, no por comodidad: el `content`
        # de azurerm_automation_runbook no se puede ACTUALIZAR --el update lleva
        # el runbook_type mal leido y Azure responde 400 "Runbook Type cannot be
        # modified"-- y el provider tampoco vuelve a leer el content desde Azure,
        # asi que el state nunca se reconcilia solo. Recrear el recurso es la
        # unica via por pipeline para dejar el state sincronizado.
        #
        # Un replace DESTRUYE y vuelve a crear el recurso. Sale en el resumen
        # auditable del plan como "delete+create", asi que queda a la vista.
        description: 'Direccion de recurso a RECREAR (destruye y crea). Vacio = ningun replace. Ej: module.mysql_backup[0].azurerm_automation_runbook.orchestrator'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'infra/terraform/**'
  schedule:
    # Drift detection: lunes 07:00 UTC.
    - cron: '0 7 * * 1'

# Mínimo a nivel de workflow; cada job pide sólo lo que usa. Un `permissions:`
# a nivel de job REEMPLAZA a este (no se suma).
#
# `id-token: write` vive únicamente en los jobs que hacen `azure/login`. El
# service principal tiene credenciales federadas para `pull_request` y
# `ref:refs/heads/main`, que NO llevan environment: un job sin environment que
# pueda pedir token OIDC y corra una action de terceros (el scan, con Checkov)
# le entregaría a esa action un token con los permisos de Terraform sobre la
# suscripción.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  # Gate estático: corre en cada PR y es lo que evita repetir defectos como el
  # WAF creado pero no asociado, o un storage con acceso público.
  scan:
    runs-on: ubuntu-latest
    # Sin id-token: no hace login en Azure. `actions: read` lo pide la subida
    # de SARIF en repos privados.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkov
        # Fijado por commit SHA inmutable (v12) para mitigar riesgos de cadena de suministro (P0)
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          # Reglas silenciadas a propósito, con motivo. Revisado 2026-07-29 al
          # correr Checkov por primera vez sobre infra/ (27 hallazgos): lo que
          # sigue es lo que quedó como decisión consciente después de arreglar
          # lo barato (secrets sin expiration_date/content_type, SAS policy,
          # logging de blob) — ver los commits de esa fecha.
          #
          #  CKV_AZURE_109, CKV_AZURE_189 — Key Vault con acceso público: el
          #    private endpoint es opcional por costo
          #    (keyvault_private_endpoint_enabled, ~USD 7/mes). RBAC +
          #    managed identity cubren el acceso mientras tanto. Pasar a
          #    privado exige una ruta de red hacia el vault desde donde se
          #    opera hoy (laptop + GitHub-hosted runners) — hoy no existe.
          #  CKV_AZURE_206 — Storage LRS: el directorio de tenants usa RAGRS,
          #    el resto no guarda datos.
          #  CKV_AZURE_59, CKV2_AZURE_33 — Storage accounts (tfstate y del
          #    stamp) con red pública: sin private endpoint, mismo motivo que
          #    el Key Vault — GitHub-hosted runners tienen IP dinámica y no
          #    hay VPN/bastion para llegar por red privada.
          #  CKV_AZURE_33 — Logging del servicio Queue: ninguna de las dos
          #    storage accounts usa Queue, sólo Blob.
          #  CKV2_AZURE_1 — Cifrado con Customer Managed Key: sin mandato de
          #    compliance que lo exija: las claves gestionadas por Microsoft
          #    ya cifran en reposo con AES-256.
          #  CKV2_AZURE_21 — SÍ está resuelto en infra real: hay un
          #    azurerm_monitor_diagnostic_setting apuntando a
          #    "${storage_account_id}/blobServices/default" con
          #    category_group=allLogs (modules/stamp/main.tf). Sigue en esta
          #    lista porque el check de grafo de Checkov no reconoce un
          #    diagnostic setting sobre un sub-recurso (blobServices) como
          #    asociado al container — limitación de la herramienta, no
          #    ausencia de logging. Verificado 2026-07-29: sin el diagnostic
          #    setting Y sin el skip, sigue marcando FAILED igual.
          #  CKV2_AZURE_40 — Shared Key en la cuenta de Storage del stamp. En prod y
          #    en staging está APAGADA (storage_shared_access_key_enabled = false en
          #    TF_VARS; fase 4 de C-01, 2026-10-12) y la app, los backups y Terraform ya
          #    entran por Entra ID. Sigue en la lista porque el job de scan no tiene los
          #    tfvars (viven en un secret) y Checkov ve el default de la variable, que
          #    sigue en true para que apagarla sea una decisión explícita de cada
          #    ambiente. Si algún día el default pasa a false, se puede sacar de acá.
          #    Ver docs/security/endurecimiento-infraestructura-saas-2026-10-09.md, 7.6.
          #  CKV2_AZURE_56 — MySQL Flexible sin private endpoint: usa VNet
          #    injection (delegated_subnet_id) en su lugar, que deja el
          #    servidor igual de privado sin pagar el PE — Checkov sólo
          #    reconoce el mecanismo de private endpoint.
          #  CKV_AZURE_94 — MySQL sin backups geo-redundantes: deployment de
          #    región única (mysql_geo_redundant_backup=false por defecto);
          #    doble costo de backup sin un segundo stamp que lo aproveche.
          #  CKV_AZURE_20 — Sin teléfono de contacto en Defender: sólo email.
          #    No hay un teléfono de guardia que declarar hoy; agregar uno acá
          #    sería inventarlo. Si se define un número de soporte, cargarlo
          #    en modules/defender (variable "alert_phone") y sacar este skip.
          #  CKV_AZURE_43 — Nombre de la storage account del stamp: Checkov no
          #    resuelve la interpolación "${var.name_compact}sa" contra el
          #    patrón que exige (minúsculas, alfanumérico, 3-24). La variable
          #    YA tiene una validation block idéntica a esa regla
          #    (modules/storage/variables.tf) — falso positivo conocido de
          #    Checkov con nombres calculados en vez de literales.
          #  CKV2_AZURE_32 — Key Vault sin private endpoint (variante del
          #    check CKV_AZURE_109/189, mismo recurso): mismo motivo, ver ahí.
          #
          # Agregados 2026-07-30 al sumar modules/mysql_backup (apagado por
          # default, mysql_backup_enabled=false — Checkov igual escanea el
          # código del módulo aunque su count sea 0):
          #  CKV_AZURE_50 — "VM extensions no instaladas": el módulo instala
          #    a propósito la extensión HybridWorkerForWindows
          #    (azurerm_virtual_machine_extension), el mecanismo oficial de
          #    Azure para registrar un Hybrid Runbook Worker — es el
          #    propósito central de la VM, no un descuido.
          #  CKV2_AZURE_24 — Automation Account con red pública: el Hybrid
          #    Worker se registra contra el endpoint público del Automation
          #    Account (hybrid_service_url) desde una VM sin IP pública.
          #    Restringir la red exigiría Private Link para Automation
          #    (recurso aparte, mismo trade-off de costo que el Key
          #    Vault/Storage de más arriba) — fuera del alcance de esta fase.
          #  CKV_AZURE_139, 163, 164, 165, 166, 233, 237 — ACR en SKU Basic:
          #    georreplicación, zona redundante, endpoints dedicados,
          #    firewall/red privada y content trust son todas features
          #    exclusivas de Premium (~USD 45/mes más que Basic: ~USD 50
          #    contra ~USD 5 por registry unit, Retail Prices API del
          #    2026-10-10; cada región replicada suma otros ~USD 50). Con un
          #    solo stamp no hay georreplicación que aprovechar. El escaneo de
          #    vulnerabilidades (163) ya está cubierto igual: el plan
          #    "Containers" de Defender for Cloud escanea imágenes en
          #    cualquier SKU de ACR (defender_resource_types en
          #    environments/prod/variables.tf).
          #
          # Agregados 2026-10-08 al sumar modules/ai_services (apagado por
          # default, ai_services_enabled=false):
          #  CKV2_AZURE_22 — Cuenta de Azure AI sin Customer Managed Key: mismo
          #    motivo que CKV2_AZURE_1 (Azure AI también cifra en reposo con
          #    AES-256 y claves gestionadas por Microsoft).
          #  CKV_AZURE_236 — Cuenta de Azure AI con keys habilitadas: es el
          #    paso 1 de la transición a Entra ID (local_auth_enabled en
          #    modules/ai_services), con la key de fallback. SACARLO en el
          #    paso 2, cuando local_auth_enabled pase a false.
          skip_check: >-
            CKV_AZURE_109,CKV_AZURE_189,CKV_AZURE_206,CKV_AZURE_59,
            CKV2_AZURE_33,CKV_AZURE_33,CKV2_AZURE_1,CKV2_AZURE_21,
            CKV2_AZURE_40,CKV2_AZURE_56,CKV_AZURE_94,CKV_AZURE_139,
            CKV_AZURE_163,CKV_AZURE_164,CKV_AZURE_165,CKV_AZURE_166,
            CKV_AZURE_233,CKV_AZURE_237,CKV_AZURE_20,CKV_AZURE_43,
            CKV2_AZURE_32,CKV_AZURE_50,CKV2_AZURE_24,CKV2_AZURE_22,
            CKV_AZURE_236

      # continue-on-error: este repo es privado y no tiene GitHub Advanced
      # Security, así que Code Scanning no está habilitado — la subida falla
      # siempre con "Resource not accessible by integration" (403),
      # independientemente de lo que encuentre Checkov. Verificado 2026-07-29:
      # el step de Checkov de arriba pasó con 0 findings y este de todos modos
      # tumbaba el job entero, bloqueando plan-apply por un paso que no es el
      # gate real. El gate es el exit code de Checkov, no esto — si algún día
      # se habilita GHAS, este paso vuelve a subir hallazgos solo, sin tocar
      # nada acá.
      - name: Subir hallazgos al Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: checkov.sarif

  plan-apply:
    # En el cron semanal este job corría ADEMÁS de `drift`, o sea dos planes de
    # producción por lunes, uno de ellos sin que nadie lo mire (el del 2026-10-05
    # cayó por la propagación del firewall del Key Vault y dejó la corrida en rojo
    # aunque `drift` pasó). Por schedule corre sólo `drift`.
    # INFRA-01: el job autenticado a prod (plan ejecuta providers) solo corre por
    # dispatch manual desde main; los PR quedan con fmt/validate/Checkov en `scan`.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # INFRA-05: acota la vida del job; el TTL del lease del Key Vault es esto + 10.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      id-token: write
      contents: read
    # En un pull_request no hay inputs, asi que cae al default: prod.
    #
    # Tiene que ser prod y no dev por dos razones. La primera es que es el
    # unico ambiente que existe: no hay stamp dev aplicado ni terraform.tfvars
    # para el. La segunda es que el nombre de este environment define el
    # subject del token OIDC (`repo:<owner>/<repo>:environment:<nombre>`), y el
    # service principal cscs-finops-terraform tiene la credencial federada de
    # `environment:prod`. Con 'dev' azure/login fallaba con AADSTS700213 en cada PR
    # que tocara infra. Las otras (`pull_request`, `ref:refs/heads/main` y dos de
    # staging, verificadas el 2026-10-10) ya no las usa ningún job: ver el runbook de
    # docs/security/endurecimiento-infraestructura-saas-2026-10-09.md.
    #
    # El apply sigue atado a workflow_dispatch (ver el paso al final), asi que
    # un PR nunca aplica cambios de Terraform: planifica contra el state de
    # prod. Ojo que NO es de solo lectura: abrir y cerrar la IP del runner en
    # el firewall del Key Vault (pasos `az keyvault network-rule` mas abajo) es
    # una escritura en Azure y corre tambien en PR.
    #
    # El gate manual NO puede vivir en el GitHub environment: los protection
    # rules (required reviewers y wait timer) no estan disponibles para repos
    # privados en el plan Free — la API responde 422 "Please ensure the billing
    # plan supports the required reviewers protection rule". Verificado el
    # 2026-07-30 sobre este repo.
    #
    # El gate equivalente vive entonces en el input `confirm`: el apply solo
    # corre si se tipea exactamente APPLY-PROD. Un dispatch sin confirmar hace
    # plan y se detiene, y lo dice en el log (paso "Aviso" mas abajo) para que
    # no se confunda con un apply exitoso.
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      # El SP de staging no puede registrar proveedores de recursos a nivel suscripcion (sus roles
      # son solo sobre sus RG) y el provider lo intenta al iniciar. Con `none` no lo intenta; los
      # proveedores ya estan registrados porque la suscripcion es la misma que la de prod. Prod
      # queda en `legacy`, que es el valor por defecto de azurerm 4.x: no cambia nada.
      # Contrato: documentacion del provider azurerm v4.81.0, `resource_provider_registrations`.
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: ${{ (github.event.inputs.environment || 'prod') == 'staging' && 'none' || 'legacy' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER || 'tfstate' }}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="key=${{ github.event.inputs.environment || 'prod' }}/terraform.tfstate"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      # terraform.tfvars está gitignored (tiene GUIDs de tenant/subscription,
      # nombre de certificado, tamaños de infra — sin passwords ni connection
      # strings, esos los genera Terraform con random_password). Sin este paso
      # `terraform plan -var-file=terraform.tfvars` nunca tuvo el archivo: el
      # workflow jamás llegó a correr un plan real hasta hoy, tapado siempre
      # por la falla de auth que se arregló antes en este mismo archivo.
      # env (no interpolación directa en el run) para no romper el contenido
      # multilínea con el shell.
      #
      # OJO con cron_jobs: si el secret todavía trae un bloque `cron_jobs`, NO
      # es el que se aplica. Los plan de abajo pasan un segundo
      # `-var-file=cron-jobs.tfvars` (versionado en git) y Terraform resuelve
      # los -var-file en orden, ganando el último para una misma variable. Los
      # horarios se cambian en ese archivo, por PR; nunca editando el secret.
      #
      # Staging lee su propio secret (`TF_VARS`, del environment staging) y EXIGE que exista: si
      # faltara, nunca cae al de prod. El secret de prod ni siquiera se carga en el entorno del
      # paso cuando el ambiente es staging.
      - name: Escribir terraform.tfvars desde el secret
        env:
          AMBIENTE: ${{ github.event.inputs.environment || 'prod' }}
          TF_VARS_STAGING: ${{ secrets.TF_VARS }}
          TF_VARS_PROD_VALOR: ${{ (github.event.inputs.environment || 'prod') != 'staging' && secrets.TF_VARS_PROD || '' }}
        run: |
          if [ "$AMBIENTE" = "staging" ]; then
            [ -n "$TF_VARS_STAGING" ] || { echo "::error::Falta el secret TF_VARS del environment staging"; exit 1; }
            printf '%s\n' "$TF_VARS_STAGING" > terraform.tfvars
          else
            printf '%s\n' "$TF_VARS_PROD_VALOR" > terraform.tfvars
          fi

      # ── Firewall del Key Vault (opción 4 de infra/docs/keyvault-network-hardening.md)
      #
      # Con `keyvault_network_acls_enabled = true` el vault queda en
      # default_action = Deny. Terraform gestiona dos secretos en su PLANO DE
      # DATOS (azurerm_key_vault_secret.cron y .mysql_password), así que sin
      # esto el plan falla con 403: este runner tiene IP pública y no hay ruta
      # a la VNet.
      #
      # Se abre sólo la IP de este runner y sólo por lo que dure el job. El
      # paso de cierre corre con `if: always()`, incluso si el plan/apply
      # revienta — de lo contrario la allowlist se llena de IPs muertas. Como
      # always() no cubre un runner perdido, la apertura deja un lease con
      # vencimiento y kv-firewall-reconcile.yml quita lo vencido (INFRA-05).
      #
      # Si el output todavía no existe (primer apply, antes de que el firewall
      # exista) el paso no hace nada y el job sigue: en ese momento el vault
      # está abierto y no hace falta permiso.
      - name: Abrir el Key Vault para este runner
        id: kv_firewall
        env:
          LEASE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE }}
          LEASE_CONTAINER: ${{ vars.TFSTATE_CONTAINER || 'tfstate' }}
          LEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          LEASE_OWNER: ${{ github.workflow }}/${{ github.job }} (${{ github.event_name }}, ${{ github.actor }})
          LEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # timeout-minutes del job + margen: el lease no vence mientras el job pueda seguir vivo.
          TTL_MINUTES: '70'
        run: |
          VAULTS=$(terraform output -json key_vault_names 2>/dev/null | jq -r '.[]?' || true)
          if [ -z "$VAULTS" ]; then
            echo "Sin key_vault_names en el state todavía — nada que abrir."
            exit 0
          fi
          IP=$(curl -fsS https://api.ipify.org)
          # Un servicio de terceros decide qué entra al firewall del vault y al
          # archivo de outputs: sólo se acepta una IPv4. Otra cosa (HTML, un salto
          # de línea con otra variable) corta el job acá, antes de escribir nada.
          [[ "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::api.ipify.org devolvió algo que no es una IPv4"; exit 1; }
          VAULTS=$(echo $VAULTS | tr '\n' ' ')
          # Outputs ANTES de la primera mutación: si el job muere a mitad de la apertura,
          # el cierre igual sabe qué limpiar.
          echo "runner_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "vaults=$VAULTS" >> "$GITHUB_OUTPUT"
          # INFRA-05: lease (vault, IP, job, dueño, vencimiento) antes de abrir. Si el
          # runner se pierde y el cierre no corre, kv-firewall-reconcile.yml quita la
          # regla cuando vence el lease.
          VAULTS="$VAULTS" RUNNER_IP="$IP" "$GITHUB_WORKSPACE/infra/scripts/kv-firewall-lease.sh" open

          # ESPERAR A QUE PROPAGUE, no un tiempo fijo.
          #
          # Acá había `sleep 20`. No alcanza: el 2026-09-14 el plan arrancó 38 s
          # después de abrir la regla y murió igual con
          #   403 ForbiddenByFirewall ... Client address: 4.154.245.224
          # para la MISMA IP que el paso acababa de autorizar. La propagación al
          # data plane del Key Vault no tiene un tiempo garantizado, así que
          # cualquier número fijo es una carrera que se gana a veces -- y cuando
          # se pierde, el apply de infraestructura queda rojo por nada.
          #
          # Sólo se espera mientras el error sea del FIREWALL: un 403 por RBAC o
          # cualquier otra falla corta el bucle en vez de comerse el timeout
          # entero por un problema que esperar no resuelve.
          for V in $VAULTS; do
            for i in $(seq 1 24); do
              if SALIDA=$(az keyvault secret list --vault-name "$V" --maxresults 1 --only-show-errors 2>&1); then
                echo "Data plane de $V accesible (intento $i)"
                break
              fi
              if ! echo "$SALIDA" | grep -q "ForbiddenByFirewall"; then
                echo "$V responde algo que no es el firewall; se sigue sin esperar más."
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "::warning title=Key Vault::$V sigue rechazando al runner tras 120 s; el plan puede fallar con 403."
              fi
              sleep 5
            done
          done

      - name: Terraform plan
        env:
          REPLACE_ADDR: ${{ inputs.replace }}
        run: |
          # El -replace se pasa como argumento separado y sin `eval`: una
          # direccion de recurso viene con corchetes y comillas, y expandirla en
          # una cadena de shell es como se inyecta un flag de mas.
          if [ -n "$REPLACE_ADDR" ]; then
            echo "::warning title=Replace solicitado::Se va a RECREAR $REPLACE_ADDR (destroy + create)."
            terraform plan -var-file=terraform.tfvars -var-file=cron-jobs.tfvars -replace="$REPLACE_ADDR" -out=tfplan
          else
            terraform plan -var-file=terraform.tfvars -var-file=cron-jobs.tfvars -out=tfplan
          fi

      # Resumen auditable del plan: SÓLO dirección y acción, sin valores.
      #
      # El `terraform plan` de arriba imprime los diffs completos, pero GitHub
      # enmascara con *** todo lo que coincida con un secret del repo — y como
      # el tfvars entero es un secret, buena parte del plan sale ilegible. Con
      # este resumen se puede auditar QUÉ recursos se tocan y con qué acción
      # (en particular los destroy y replace) sin exponer un solo valor.
      - name: Resumen del plan (auditable)
        run: |
          terraform show -json tfplan > plan.json
          echo "### Resumen del plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join("+")) \(.address)"
          ' plan.json | sort | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "--- conteo por acción ---"
          jq -r '.resource_changes[].change.actions | join("+")' plan.json | sort | uniq -c


      # Apply sólo en ejecución manual, nunca automático desde un PR, y sólo
      # con la confirmación tipeada (ver el comentario del job).
      - name: Aviso — dispatch sin confirmar, no se aplica
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != (inputs.environment == 'staging' && 'APPLY-STAGING' || 'APPLY-PROD')
        # Por env y no interpolado en el script: `confirm` es texto libre.
        env:
          CONFIRM: ${{ inputs.confirm }}
          ESPERADO: ${{ inputs.environment == 'staging' && 'APPLY-STAGING' || 'APPLY-PROD' }}
        run: |
          echo "::warning title=Plan sin aplicar::El plan de arriba NO se aplicó."
          echo "Para aplicar, re-lanzar el workflow escribiendo $ESPERADO en el campo 'confirm'."
          echo "Recibido: '$CONFIRM'"

      - name: Validar seguridad del apply
        if: github.event_name == 'workflow_dispatch' && inputs.confirm == (inputs.environment == 'staging' && 'APPLY-STAGING' || 'APPLY-PROD')
        env:
          REPLACE_ADDR: ${{ inputs.replace }}
        run: node "$GITHUB_WORKSPACE/scripts/validate-terraform-apply-plan.mjs" plan.json

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.confirm == (inputs.environment == 'staging' && 'APPLY-STAGING' || 'APPLY-PROD')
        run: terraform apply -auto-approve tfplan

      # ── Devolver APP_VERSION, que el apply se lleva puesta ──────────────────
      #
      # El deploy la setea con `--set-env-vars APP_VERSION=<sha>` porque como
      # build-arg invalidaría el cache justo antes del `npm run build` y los
      # deploys pasaban a durar 20-60 min. Terraform no la conoce, así que en
      # cada apply la ve como deriva y la BORRA: /api/status deja de reportar el
      # SHA desplegado y pasa a decir "unknown" hasta el próximo deploy.
      #
      # NO se arregla con `ignore_changes` sobre `env`. Ese bloque es `dynamic`,
      # así que no se puede ignorar UNA variable: o se ignora `env` entero o
      # nada. Y `env` entero es justo donde viven DB_HOST, REDIS_HOST y
      # AZURE_KEYVAULT_URL — ignorarlos significaría que un cambio de FQDN de
      # MySQL no llegaría nunca a la app, en silencio. Perder el marcador de
      # versión es molesto; apuntar a la base equivocada, no.
      #
      # Se reconstruye desde el TAG DE LA IMAGEN, que es el mismo SHA y que
      # Terraform sí ignora (ver el `lifecycle` del módulo containerapp). Por eso
      # este paso es idempotente: sirve igual si el apply se corre dos veces.
      - name: Restaurar APP_VERSION
        if: github.event_name == 'workflow_dispatch' && inputs.confirm == (inputs.environment == 'staging' && 'APPLY-STAGING' || 'APPLY-PROD')
        run: |
          set -euo pipefail
          terraform output -json web_apps | jq -r 'to_entries[] | "\(.value.resource_group) \(.value.app)"' |
          while read -r RG APP; do
            [ -n "$RG" ] && [ -n "$APP" ] || continue
            IMG=$(az containerapp show -g "$RG" -n "$APP" \
                    --query "properties.template.containers[0].image" -o tsv)
            SHA="${IMG##*:}"
            # Un tag que no parece un SHA de git (por ejemplo `latest`) no se
            # usa: preferimos dejarla vacía a escribir un valor que miente.
            case "$SHA" in
              [0-9a-f]*) [ ${#SHA} -ge 7 ] || { echo "::warning::tag '$SHA' no parece un SHA en $APP"; continue; } ;;
              *) echo "::warning::tag '$SHA' no parece un SHA en $APP"; continue ;;
            esac
            ACTUAL=$(az containerapp show -g "$RG" -n "$APP" \
                       --query "properties.template.containers[0].env[?name=='APP_VERSION'].value | [0]" -o tsv)
            if [ "$ACTUAL" = "$SHA" ]; then
              echo "APP_VERSION ya está en $SHA para $APP"
            else
              echo "Restaurando APP_VERSION=$SHA en $APP (estaba: '${ACTUAL:-vacía}')"
              az containerapp update -g "$RG" -n "$APP" --set-env-vars APP_VERSION="$SHA" >/dev/null
            fi
          done

      # Corre pase lo que pase: si el plan o el apply fallan, la IP de este
      # runner NO debe quedar en la allowlist del vault.
      - name: Cerrar el Key Vault
        if: always() && steps.kv_firewall.outputs.runner_ip != ''
        timeout-minutes: 5
        env:
          LEASE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE }}
          LEASE_CONTAINER: ${{ vars.TFSTATE_CONTAINER || 'tfstate' }}
          LEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          VAULTS: ${{ steps.kv_firewall.outputs.vaults }}
          RUNNER_IP: ${{ steps.kv_firewall.outputs.runner_ip }}
        # Reintenta y, si no puede, deja el job en rojo: nunca éxito silencioso. No quita
        # la regla si otro job vigente tiene lease sobre la misma IP.
        run: '"$GITHUB_WORKSPACE/infra/scripts/kv-firewall-lease.sh" close'

  # Detecta cambios hechos a mano en el portal. Corre los lunes a la mañana.
  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # INFRA-05: el TTL del lease del Key Vault es esto + 10.
    timeout-minutes: 30
    # Con environment, el sujeto del token OIDC es `environment:prod`, el mismo que
    # usan plan-apply y el deploy. Sin él era `ref:refs/heads/main`, una credencial
    # federada más sobre el service principal que sólo existía para este job.
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        # Solo prod. Staging se suma cuando tenga un state aplicado: un drift sobre un state
        # vacio planearia crear todo y dejaria el lunes en rojo. Al sumarlo, el paso de init y el
        # de tfvars de este job tienen que leer el contenedor y el secret por ambiente, igual que
        # plan-apply.
        environment: [prod]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate"
      # Mismo motivo que en el job plan-apply: terraform.tfvars está gitignored.
      # El `-var-file=cron-jobs.tfvars` del plan de drift tiene que estar acá
      # también: sin él, el drift se calcularía contra el cron_jobs viejo del
      # secret y reportaría diferencias falsas en cada cron job.
      - name: Escribir terraform.tfvars desde el secret
        env:
          TF_VARS_CONTENT: ${{ secrets.TF_VARS_PROD }}
        run: printf '%s\n' "$TF_VARS_CONTENT" > terraform.tfvars

      # ── Firewall del Key Vault (opción 4 de infra/docs/keyvault-network-hardening.md)
      #
      # Con `keyvault_network_acls_enabled = true` el vault queda en
      # default_action = Deny. Terraform gestiona dos secretos en su PLANO DE
      # DATOS (azurerm_key_vault_secret.cron y .mysql_password), así que sin
      # esto el plan falla con 403: este runner tiene IP pública y no hay ruta
      # a la VNet.
      #
      # Se abre sólo la IP de este runner y sólo por lo que dure el job. El
      # paso de cierre corre con `if: always()`, incluso si el plan/apply
      # revienta — de lo contrario la allowlist se llena de IPs muertas. Como
      # always() no cubre un runner perdido, la apertura deja un lease con
      # vencimiento y kv-firewall-reconcile.yml quita lo vencido (INFRA-05).
      #
      # Si el output todavía no existe (primer apply, antes de que el firewall
      # exista) el paso no hace nada y el job sigue: en ese momento el vault
      # está abierto y no hace falta permiso.
      - name: Abrir el Key Vault para este runner
        id: kv_firewall
        env:
          LEASE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE }}
          LEASE_CONTAINER: tfstate
          LEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          LEASE_OWNER: ${{ github.workflow }}/${{ github.job }} (${{ github.event_name }}, ${{ github.actor }})
          LEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # timeout-minutes del job + margen: el lease no vence mientras el job pueda seguir vivo.
          TTL_MINUTES: '40'
        run: |
          VAULTS=$(terraform output -json key_vault_names 2>/dev/null | jq -r '.[]?' || true)
          if [ -z "$VAULTS" ]; then
            echo "Sin key_vault_names en el state todavía — nada que abrir."
            exit 0
          fi
          IP=$(curl -fsS https://api.ipify.org)
          # Un servicio de terceros decide qué entra al firewall del vault y al
          # archivo de outputs: sólo se acepta una IPv4. Otra cosa (HTML, un salto
          # de línea con otra variable) corta el job acá, antes de escribir nada.
          [[ "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::api.ipify.org devolvió algo que no es una IPv4"; exit 1; }
          VAULTS=$(echo $VAULTS | tr '\n' ' ')
          # Outputs ANTES de la primera mutación: si el job muere a mitad de la apertura,
          # el cierre igual sabe qué limpiar.
          echo "runner_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "vaults=$VAULTS" >> "$GITHUB_OUTPUT"
          # INFRA-05: lease (vault, IP, job, dueño, vencimiento) antes de abrir. Si el
          # runner se pierde y el cierre no corre, kv-firewall-reconcile.yml quita la
          # regla cuando vence el lease.
          VAULTS="$VAULTS" RUNNER_IP="$IP" "$GITHUB_WORKSPACE/infra/scripts/kv-firewall-lease.sh" open

          # ESPERAR A QUE PROPAGUE, no un tiempo fijo.
          #
          # Acá había `sleep 20`. No alcanza: el 2026-09-14 el plan arrancó 38 s
          # después de abrir la regla y murió igual con
          #   403 ForbiddenByFirewall ... Client address: 4.154.245.224
          # para la MISMA IP que el paso acababa de autorizar. La propagación al
          # data plane del Key Vault no tiene un tiempo garantizado, así que
          # cualquier número fijo es una carrera que se gana a veces -- y cuando
          # se pierde, el apply de infraestructura queda rojo por nada.
          #
          # Sólo se espera mientras el error sea del FIREWALL: un 403 por RBAC o
          # cualquier otra falla corta el bucle en vez de comerse el timeout
          # entero por un problema que esperar no resuelve.
          for V in $VAULTS; do
            for i in $(seq 1 24); do
              if SALIDA=$(az keyvault secret list --vault-name "$V" --maxresults 1 --only-show-errors 2>&1); then
                echo "Data plane de $V accesible (intento $i)"
                break
              fi
              if ! echo "$SALIDA" | grep -q "ForbiddenByFirewall"; then
                echo "$V responde algo que no es el firewall; se sigue sin esperar más."
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "::warning title=Key Vault::$V sigue rechazando al runner tras 120 s; el plan puede fallar con 403."
              fi
              sleep 5
            done
          done

      - name: Detectar drift
        run: terraform plan -var-file=terraform.tfvars -var-file=cron-jobs.tfvars -detailed-exitcode

      # Corre pase lo que pase: si el plan o el apply fallan, la IP de este
      # runner NO debe quedar en la allowlist del vault.
      - name: Cerrar el Key Vault
        if: always() && steps.kv_firewall.outputs.runner_ip != ''
        timeout-minutes: 5
        env:
          LEASE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE }}
          LEASE_CONTAINER: tfstate
          LEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          VAULTS: ${{ steps.kv_firewall.outputs.vaults }}
          RUNNER_IP: ${{ steps.kv_firewall.outputs.runner_ip }}
        # Reintenta y, si no puede, deja el job en rojo: nunca éxito silencioso. No quita
        # la regla si otro job vigente tiene lease sobre la misma IP.
        run: '"$GITHUB_WORKSPACE/infra/scripts/kv-firewall-lease.sh" close'

